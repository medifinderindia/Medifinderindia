name: Build MediFinder Android APK

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Gradle 8.9 (retry-safe download)
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.9"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          mkdir -p "$GRADLE_DIR"
          for attempt in 1 2 3 4 5; do
            echo "Downloading Gradle $GRADLE_VERSION (attempt $attempt/5)"
            if curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 300 \
              "https://downloads.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
              --output "$ZIP"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Unable to download Gradle after 5 attempts"
              exit 1
            fi
            sleep 10
          done
          unzip -q "$ZIP" -d "$GRADLE_DIR"
          echo "$GRADLE_DIR/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          "$GRADLE_DIR/gradle-$GRADLE_VERSION/bin/gradle" --version

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact (for build diagnostics)
        uses: actions/upload-artifact@v4
        with:
          name: medifinder-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare stable direct-download APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk medifinder-india-latest.apk

      - name: Publish or update stable APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: MediFinder India — Latest Android APK
          body: |
            Latest automated Android APK build for MediFinder India.
            Download **medifinder-india-latest.apk** and install it on your Android device.
            This rolling release is updated after each successful push/workflow run.
          files: medifinder-india-latest.apk
          overwrite_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
