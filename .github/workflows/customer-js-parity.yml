name: Customer JavaScript Parity Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feat/customer-panel-v2-foundation"
      - "feat/customer-panel-rebuild-20261108"
    paths:
      - "user.js"
      - "user.min.js"
      - "customer-v2/**"
      - "supabase/migrations/**"
      - ".github/workflows/customer-js-parity.yml"

permissions:
  contents: read

jobs:
  parity-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax and source/bundle parity audit
        run: node customer-v2/tools/js-parity-audit.js user.js user.min.js > customer-v2/js-parity-report.json

      - name: Check V2 checkout rules syntax
        run: node --check customer-v2/checkout-rules.js

      - name: Check V2 customer app routing syntax
        run: node --check customer-v2/app.js

      - name: Check V2 Supabase bootstrap syntax
        run: node --check customer-v2/supabase-bootstrap.js

      - name: Check V2 product detail syntax
        run: node --check customer-v2/product-detail-ui.js

      - name: Check V2 checkout syntax
        run: node --check customer-v2/checkout-ui.js

      - name: Test V2 atomic COD checkout client flow
        run: node customer-v2/tools/test-checkout-ui.js

      - name: Test atomic COD database contract
        run: node customer-v2/tools/test-cod-sql-contract.js

      - name: Test V2 product detail and cart interaction
        run: node customer-v2/tools/test-product-detail-ui.js

      - name: Check V2 checkout UI syntax
        run: node --check customer-v2/checkout-ui.js

      - name: Test V2 checkout DOM selector contract
        run: node customer-v2/tools/test-checkout-ui-contract.js

      - name: Check V2 people adapter syntax
        run: node --check customer-v2/people-adapter.js

      - name: Test V2 address phone and PIN validation
        run: node customer-v2/tools/test-people-address-validation.js

      - name: Check V2 people UI syntax
        run: node --check customer-v2/people-ui.js

      - name: Check V2 prescription UI syntax
        run: node --check customer-v2/prescriptions-ui.js

      - name: Test private prescription upload contract
        run: node customer-v2/tools/test-prescription-upload-contract.js

      - name: Check V2 cart UI syntax
        run: node --check customer-v2/cart-ui.js

      - name: Check V2 runtime status syntax
        run: node --check customer-v2/runtime-status.js

      - name: Check V2 service booking syntax
        run: node --check customer-v2/service-bookings.js

      - name: Test V2 service booking integration contract
        run: node customer-v2/tools/test-service-bookings.js

      - name: Check V2 integration syntax
        run: node --check customer-v2/integration.js

      - name: Check V2 account hub syntax
        run: node --check customer-v2/account-hub.js

      - name: Test V2 cart store
        run: node customer-v2/tools/test-cart-store.js

      - name: Test catalogue search
        run: node customer-v2/tools/test-catalogue-search.js

      - name: Test authenticated session gate
        run: node customer-v2/tools/test-auth-session.js

      - name: Test real catalogue query contract
        run: node customer-v2/tools/test-catalogue-adapter.js

      - name: Test legacy-compatible wishlist contract
        run: node customer-v2/tools/test-wishlist-adapter.js

      - name: Test V2 legacy action bridge
        run: node customer-v2/tools/test-legacy-actions.js

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: customer-js-parity-report
          path: customer-v2/js-parity-report.json
          if-no-files-found: error
          retention-days: 14
