name: Rebuild customer production assets

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/customer-panel-rebuild-20261108"
    paths:
      - "user.js"
      - "user.css"
      - "build.sh"
      - "customer-v2/tools/js-parity-audit.js"
      - ".github/workflows/rebuild-customer-assets.yml"

permissions:
  contents: write

concurrency:
  group: customer-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild minified JavaScript and CSS using the repository build script
        run: sh build.sh

      - name: Verify generated JavaScript syntax
        run: node --check user.js && node --check user.min.js

      - name: Verify Android bridge and source/bundle feature parity
        run: |
          node customer-v2/tools/js-parity-audit.js user.js user.min.js > customer-v2/js-parity-report.json
          node -e "const r=require('./customer-v2/js-parity-report.json'); if(!r.source.syntax.ok || !r.bundle.syntax.ok || r.mismatches.length) { console.error(JSON.stringify(r,null,2)); process.exit(1); } if(!r.signals.find(x=>x.feature==='Android native bridge')?.bundle) { console.error('Android native bridge missing from generated bundle'); process.exit(1); } console.log('Source and generated bundle are in parity.');"

      - name: Commit generated production assets on the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add user.min.js user.min.css
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
          else
            git commit -m "build: regenerate customer production assets"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
