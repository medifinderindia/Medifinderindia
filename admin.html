<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediFinder Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div class="app-shell" id="appShell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mark">M</div>
      <div class="brand-text"><strong>MediFinder</strong><span>Admin Console</span></div>
      <button class="sidebar-collapse-btn" id="collapseBtn" title="Collapse sidebar">«</button>
    </div>
    <nav class="sidebar-scroll" id="sidebarScroll"></nav>
    <div class="sidebar-foot">
      <div class="admin-chip" data-nav="adminroles">
        <div class="admin-avatar">SA</div>
        <div class="admin-meta"><strong>Super Admin</strong><span>admin@medifinder.app</span></div>
      </div>
    </div>
  </aside>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <div class="main-col">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-search" id="globalSearchWrap">
        <span class="ic">⌕</span>
        <input type="text" id="globalSearch" autocomplete="off" placeholder="Search orders, users, pharmacies, riders, medicines...">
        <div class="global-search-results" id="globalSearchResults"></div>
      </div>
      <div class="topbar-actions">
        <div class="live-pill"><span class="blip"></span>Live</div>
        <button class="icon-btn" title="Notifications">◔<span class="dot"></span></button>
        <button class="icon-btn" title="Settings" data-nav="settings">⚙</button>
      </div>
    </header>

    <main class="content" id="content"></main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="supabase-constants.js"></script>
<script src="admin.js"></script>
</body>
</html>
