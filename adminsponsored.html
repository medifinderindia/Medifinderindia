<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="theme-color" content="#e02020">
    <title>Admin - Sponsored Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="supabase-constants.js?v=13"></script>
    <script src="prod-utils.js?v=13"></script>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#e02020;--primary-dark:#b71c1c;--primary-light:#ff4747;--sidebar-bg:#1a1a2e;--sidebar-hover:#16213e;--sidebar-active:#e02020;--bg:#f8fafc;--card:#fff;--text:#1a1a2e;--text-muted:#64748b;--border:#e8eaef;--success:#10b981;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,0.08);--radius:12px}
        body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
        a{text-decoration:none;color:inherit}

        /* Sidebar */
        .sidebar{width:260px;background:var(--sidebar-bg);color:#fff;position:fixed;top:0;left:0;height:100vh;z-index:1000;overflow-y:auto;transition:transform .3s ease;box-shadow:2px 0 15px rgba(0,0,0,0.2)}
        .sidebar-header{padding:24px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.08)}
        .sidebar-logo{width:42px;height:42px;border-radius:10px;object-fit:cover}
        .sidebar-brand{flex:1}
        .sidebar-brand h2{font-size:16px;font-weight:700;letter-spacing:-0.3px;line-height:1.2}
        .sidebar-brand h2 span{color:var(--primary-light)}
        .sidebar-brand p{font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
        .sidebar-nav{padding:12px 0}
        .sidebar-section{padding:8px 20px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,0.3);margin-top:12px}
        .sidebar-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;transition:all .2s;cursor:pointer;border-left:3px solid transparent}
        .sidebar-item:hover{background:var(--sidebar-hover);color:#fff}
        .sidebar-item.active{background:rgba(224,32,32,0.15);color:#fff;border-left-color:var(--primary)}
        .sidebar-item i{width:20px;text-align:center;font-size:14px}
        .sidebar-divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 20px}
        .sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08)}
        .sidebar-footer .role-switch{display:flex;gap:6px}
        .role-btn{flex:1;padding:8px 6px;border:none;border-radius:8px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:all .2s}
        .role-btn.user-role{background:rgba(100,116,139,0.2);color:rgba(255,255,255,0.6)}
        .role-btn.merchant-role{background:rgba(245,158,11,0.2);color:#f59e0b}
        .role-btn.delivery-role{background:rgba(16,185,129,0.2);color:#10b981}
        .role-btn:hover{transform:scale(1.05)}

        /* Main */
        .main{flex:1;margin-left:260px;padding:24px}
        .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .topbar h1{font-size:22px;font-weight:700}
        .topbar h1 i{color:var(--primary);margin-right:8px}
        .mobile-toggle{display:none;background:var(--primary);color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999}

        /* Cards */
        .card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .card h2 i{color:var(--primary)}

        /* Form */
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
        .form-group{display:flex;flex-direction:column;gap:4px}
        .form-group.full{grid-column:1/-1}
        .form-group label{font-size:12px;font-weight:600;color:var(--text-muted)}
        .form-group input,.form-group select,.form-group textarea{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;transition:border-color .2s;background:var(--bg)}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
        .form-group textarea{resize:vertical}
        .actions{display:flex;gap:8px;margin-top:16px}

        /* Buttons */
        .btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-primary:hover{background:var(--primary-dark)}
        .btn-secondary{background:var(--text-muted);color:#fff}
        .btn-secondary:hover{opacity:0.8}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-danger:hover{opacity:0.8}
        .btn-success{background:var(--success);color:#fff}
        .btn-success:hover{opacity:0.8}
        .btn-sm{padding:6px 12px;font-size:11px}

        /* List */
        .list-item{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:var(--card);transition:box-shadow .2s}
        .list-item:hover{box-shadow:var(--shadow)}
        .gradient-preview{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
        .list-info{flex:1}
        .list-info h4{font-size:14px;font-weight:600;margin-bottom:2px}
        .list-info p{font-size:12px;color:var(--text-muted)}
        .list-actions{display:flex;gap:6px;align-items:center}
        .empty{text-align:center;padding:40px;color:var(--text-muted)}
        .empty i{font-size:40px;margin-bottom:10px;opacity:0.3}

        /* Toggle */
        .toggle{position:relative;width:40px;height:22px;flex-shrink:0}
        .toggle input{opacity:0;width:0;height:0}
        .toggle .slider{position:absolute;inset:0;background:#ccc;border-radius:22px;cursor:pointer;transition:0.3s}
        .toggle .slider:before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.3s}
        .toggle input:checked+.slider{background:var(--primary)}
        .toggle input:checked+.slider:before{transform:translateX(18px)}
        .toggle.expired input:checked+.slider{background:#94a3b8}

        .expiry-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#fee2e2;color:var(--danger);text-transform:uppercase;letter-spacing:0.4px}
        .expiry-badge.soon{background:#fef3c7;color:#d97706}

        /* Toast */
        .toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;display:flex;align-items:center;gap:8px}
        .toast.show{opacity:1;transform:translateY(0)}

        /* Responsive */
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}
            .sidebar.open{transform:translateX(0)}
            .sidebar-overlay.open{display:block}
            .main{margin-left:0}
            .mobile-toggle{display:flex;align-items:center;justify-content:center}
            .form-row{grid-template-columns:1fr}
            .list-item{flex-wrap:wrap}
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="1779304435608.png" alt="Logo" class="sidebar-logo">
            <div class="sidebar-brand">
                <h2>MEDI<span>FINDER</span></h2>
                <p>Admin Panel</p>
            </div>
        </div>
        <div class="sidebar-nav">
            <div class="sidebar-section">Main</div>
            <a class="sidebar-item" href="admin-dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
            <a class="sidebar-item" href="adminuser.html"><i class="fas fa-users"></i> User Management</a>
            <a class="sidebar-item" href="adminmarchent.html"><i class="fas fa-store"></i> Merchant Management</a>
            <a class="sidebar-item" href="admindboy.html"><i class="fas fa-motorcycle"></i> Rider Management</a>
            <div class="sidebar-section">Marketing</div>
            <a class="sidebar-item active" href="adminsponsored.html"><i class="fas fa-star"></i> Sponsored Products</a>
            <div class="sidebar-divider"></div>
            <a class="sidebar-item" href="#" onclick="localStorage.removeItem('admin_auth_in_progress');window.location.replace('index.html')"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </div>
        <div class="sidebar-footer">
            <div class="role-switch">
                <a class="role-btn user-role" href="adminuser.html">User View</a>
                <a class="role-btn merchant-role" href="adminmarchent.html">Merchant View</a>
                <a class="role-btn delivery-role" href="admindboy.html">Delivery Boy</a>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="topbar">
            <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1><i class="fas fa-star"></i> Sponsored Products</h1>
        </div>

        <div class="card">
            <h2 id="formTitle"><i class="fas fa-plus-circle"></i> Add Sponsored Product</h2>
            <form id="sponsoredForm">
                <input type="hidden" id="editId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="spTitle" placeholder="e.g., Vitamin D3 Booster" required>
                    </div>
                    <div class="form-group">
                        <label>Subtitle</label>
                        <input type="text" id="spSubtitle" placeholder="e.g., 50% OFF on first order">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tag</label>
                        <input type="text" id="spTag" placeholder="e.g., NEW LAUNCH" value="SPONSORED">
                    </div>
                    <div class="form-group">
                        <label>Button Text</label>
                        <input type="text" id="spBtnText" placeholder="e.g., Shop Now" value="Shop Now">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full">
                        <label>Button Link (URL or Product ID) — paste a product link to auto-pull its real photo</label>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="spBtnAction" placeholder="e.g., product-detail.html?id=123  or just  123" style="flex:1;">
                            <button type="button" class="btn btn-secondary btn-sm" id="fetchProductBtn" onclick="fetchLinkedProduct()" style="white-space:nowrap;"><i class="fas fa-magnifying-glass"></i> Fetch Product</button>
                        </div>
                        <div id="linkedProductPreview" style="display:none;margin-top:10px;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);">
                            <img id="linkedProductImg" src="" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px;">
                            <div style="flex:1;">
                                <div id="linkedProductName" style="font-size:13px;font-weight:700;"></div>
                                <div id="linkedProductMeta" style="font-size:11px;color:var(--text-muted);"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Sort Order</label>
                        <input type="number" id="spSort" value="0">
                    </div>
                    <div class="form-group">
                        <label>First Order Discount % (optional — leave blank for no deal)</label>
                        <input type="number" id="spFirstOrderDiscount" placeholder="e.g., 50" min="1" max="90">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Valid Until (optional — auto-removed from app after this date)</label>
                        <input type="date" id="spValidUntil">
                    </div>
                    <div class="form-group">
                        <!-- spacer to keep the grid aligned -->
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Gradient</label>
                        <select id="spGradient">
                            <option value="linear-gradient(135deg, #e02020, #ff6b6b)">Red</option>
                            <option value="linear-gradient(135deg, #b71c1c, #e57373)">Dark Red</option>
                            <option value="linear-gradient(135deg, #c62828, #ef5350)">Crimson</option>
                            <option value="linear-gradient(135deg, #d32f2f, #ff8a65)">Orange-Red</option>
                            <option value="linear-gradient(135deg, #1a1a2e, #2d3436)">Dark</option>
                            <option value="linear-gradient(135deg, #f59e0b, #fbbf24)">Gold</option>
                            <option value="linear-gradient(135deg, #10b981, #34d399)">Green</option>
                            <option value="linear-gradient(135deg, #e02020, #b71c1c)">Brand Red</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Icon</label>
                        <select id="spIcon">
                            <option value="fa-solid fa-capsules">Capsules</option>
                            <option value="fa-solid fa-baby">Baby</option>
                            <option value="fa-solid fa-syringe">Syringe</option>
                            <option value="fa-solid fa-heart-pulse">Heart</option>
                            <option value="fa-solid fa-shield-halved">Shield</option>
                            <option value="fa-solid fa-triangle-exclamation">Warning</option>
                            <option value="fa-solid fa-file-prescription">Prescription</option>
                            <option value="fa-solid fa-bolt">Lightning</option>
                            <option value="fa-solid fa-fire">Fire</option>
                            <option value="fa-solid fa-star">Star</option>
                        </select>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-times"></i> Cancel</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2><i class="fas fa-list"></i> All Sponsored Products</h2>
            <div id="productsList"></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>localStorage.removeItem('admin_auth_in_progress');</script>
    <script>
        // URL & key loaded from supabase-constants.js
        let db = null;
        try { if (window.supabase && window.supabase.createClient) db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } }); } catch(e) { /* error */ }

        function extractProductId(raw) {
            if (!raw) return '';
            raw = raw.trim();
            const m = raw.match(/[?&]id=([^&#]+)/);
            if (m) return decodeURIComponent(m[1]);
            // plain id pasted with no URL wrapper
            if (!raw.includes('/') && !raw.includes('.html')) return raw;
            return '';
        }

        async function fetchLinkedProduct() {
            const raw = document.getElementById('spBtnAction').value;
            const id = extractProductId(raw);
            const preview = document.getElementById('linkedProductPreview');
            if (!id) { showToast('Paste a valid product link or ID first', 'error'); preview.style.display = 'none'; return; }
            if (!db) { showToast('Not connected to database', 'error'); return; }
            try {
                const { data, error } = await db.from('medicines').select('*').eq('id', id).single();
                if (error || !data) { showToast('No product found for that link/ID', 'error'); preview.style.display = 'none'; return; }
                const img = data.image_url || '';
                document.getElementById('linkedProductImg').src = img;
                document.getElementById('linkedProductName').textContent = data.name || data.product_name || 'Unnamed product';
                document.getElementById('linkedProductMeta').textContent = '₹' + (data.selling_price || data.unit_price || '0') + (data.category ? ' · ' + data.category : '');
                preview.style.display = 'flex';
                // Auto-fill title/subtitle only if the admin hasn't typed anything yet
                if (!document.getElementById('spTitle').value) document.getElementById('spTitle').value = data.name || data.product_name || '';
                if (!document.getElementById('spSubtitle').value && data.selling_price) document.getElementById('spSubtitle').value = 'Now at ₹' + data.selling_price;
                // Normalize the link so the storefront can resolve the same product reliably
                document.getElementById('spBtnAction').value = `product-detail.html?id=${id}`;
                showToast('Product found — its real photo will show on the storefront banner', 'success');
            } catch (e) {
                showToast('Error: ' + (e.message || e), 'error');
                preview.style.display = 'none';
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // ✅ Cache of the last-loaded rows, keyed by id — used by editItem() so we
        // never have to embed raw JSON (with the title/subtitle text inside it)
        // straight into an onclick="" attribute. That used to silently break —
        // and drop the saved link/offer — the moment a title or subtitle
        // contained an apostrophe or quote (e.g. "Grandma's Vitamin C").
        let sponsoredProductsCache = {};

        function todayISODate() {
            return new Date().toISOString().split('T')[0];
        }

        // ✅ NEW: Auto-off sweep — anything past its "Valid Until" date but still
        // marked Active gets flipped to Inactive automatically, so an expired
        // offer never lingers live in the admin panel or the user app.
        async function sweepExpiredSponsors(rows) {
            if (!db) return rows;
            const today = todayISODate();
            const expiredStillActive = rows.filter(p => p.valid_until && p.valid_until < today && p.is_active);
            if (expiredStillActive.length === 0) return rows;
            try {
                await db.from('sponsored_products').update({ is_active: false }).in('id', expiredStillActive.map(p => p.id));
                expiredStillActive.forEach(p => { p.is_active = false; });
            } catch (e) { /* fail soft — still show the correct badge below even if the write fails */ }
            return rows;
        }

        async function loadProducts() {
            if (!db) return;
            try {
                let { data, error } = await db.from('sponsored_products').select('*').order('sort_order');
                if (error) { showToast('Load error: ' + error.message, 'error'); return; }
                data = await sweepExpiredSponsors(data || []);

                sponsoredProductsCache = {};
                data.forEach(p => { sponsoredProductsCache[p.id] = p; });

                const list = document.getElementById('productsList');
                if (!data || data.length === 0) { list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><p>No sponsored products yet</p></div>'; return; }

                const today = todayISODate();
                list.innerHTML = data.map(p => {
                    const isExpired = p.valid_until && p.valid_until < today;
                    let expiryBadge = '';
                    if (p.valid_until) {
                        if (isExpired) {
                            expiryBadge = `<span class="expiry-badge">Expired ${p.valid_until}</span>`;
                        } else {
                            expiryBadge = `<span class="expiry-badge soon">Valid till ${p.valid_until}</span>`;
                        }
                    }
                    const discountBadge = p.first_order_discount_percent ? `<span style="font-size:11px;font-weight:700;color:var(--primary);">${p.first_order_discount_percent}% OFF</span>` : '';
                    return `
                <div class="list-item">
                    <div class="gradient-preview" style="background:${p.gradient}">
                        <i class="${p.icon_class}"></i>
                    </div>
                    <div class="list-info">
                        <h4>${escapeHtml(p.tag)} — ${escapeHtml(p.title)}</h4>
                        <p>${escapeHtml(p.subtitle || '')} | Sort: ${p.sort_order} | ${p.is_active ? '<span style="color:var(--success)">Active</span>' : '<span style="color:var(--text-muted)">Inactive</span>'} ${discountBadge ? ' | ' + discountBadge : ''} ${expiryBadge ? ' | ' + expiryBadge : ''}</p>
                    </div>
                    <div class="list-actions">
                        <label class="toggle ${isExpired ? 'expired' : ''}" title="${isExpired ? 'Expired — reactivating will not un-expire it, extend Valid Until first' : ''}"><input type="checkbox" ${p.is_active ? 'checked' : ''} onchange="toggleActive('${p.id}', this.checked)"><span class="slider"></span></label>
                        <button class="btn btn-primary btn-sm" onclick="editItem('${p.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="deleteItem('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
                }).join('');
            } catch(e) { showToast('Load error: ' + (e.message || e), 'error'); }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.getElementById('sponsoredForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!db) return;
            const id = document.getElementById('editId').value;
            const obj = {
                title: document.getElementById('spTitle').value,
                subtitle: document.getElementById('spSubtitle').value,
                tag: document.getElementById('spTag').value || 'SPONSORED',
                gradient: document.getElementById('spGradient').value,
                icon_class: document.getElementById('spIcon').value,
                btn_text: document.getElementById('spBtnText').value,
                // ✅ FIXED: the pasted/fetched link is saved exactly as typed/normalized —
                // nothing here was ever stripping it, the real bug was the fragile
                // onclick='editItem(${JSON.stringify(p)})' below silently breaking the
                // Edit button (and therefore re-saving) whenever the title/subtitle had
                // a quote in it. That's fixed by the id-lookup version of editItem() above.
                btn_action: document.getElementById('spBtnAction').value.trim(),
                sort_order: parseInt(document.getElementById('spSort').value) || 0,
                first_order_discount_percent: parseInt(document.getElementById('spFirstOrderDiscount').value) || null,
                valid_until: document.getElementById('spValidUntil').value || null,
                is_active: true
            };
            try {
                if (id) {
                    const { error } = await db.from('sponsored_products').update(obj).eq('id', id);
                    if (error) { showToast('Update failed: ' + error.message, 'error'); return; }
                    showToast('Updated!', 'success');
                } else {
                    const { error } = await db.from('sponsored_products').insert(obj);
                    if (error) { showToast('Add failed: ' + error.message, 'error'); return; }
                    showToast('Added!', 'success');
                }
            } catch(e) { showToast('Error: ' + (e.message || e), 'error'); return; }
            resetForm();
            loadProducts();
        });

        function editItem(id) {
            const p = sponsoredProductsCache[id];
            if (!p) { showToast('Could not find that item — refresh and try again', 'error'); return; }
            document.getElementById('editId').value = p.id;
            document.getElementById('spTitle').value = p.title || '';
            document.getElementById('spSubtitle').value = p.subtitle || '';
            document.getElementById('spTag').value = p.tag || '';
            document.getElementById('spBtnText').value = p.btn_text || '';
            document.getElementById('spBtnAction').value = p.btn_action || '';
            document.getElementById('spSort').value = p.sort_order;
            document.getElementById('spFirstOrderDiscount').value = p.first_order_discount_percent || '';
            document.getElementById('spValidUntil').value = p.valid_until || '';
            document.getElementById('spGradient').value = p.gradient;
            document.getElementById('spIcon').value = p.icon_class;
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Sponsored Product';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (extractProductId(p.btn_action || '')) fetchLinkedProduct();
            else document.getElementById('linkedProductPreview').style.display = 'none';
        }

        function resetForm() {
            document.getElementById('sponsoredForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('spSort').value = '0';
            document.getElementById('spValidUntil').value = '';
            document.getElementById('linkedProductPreview').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Add Sponsored Product';
        }

        async function toggleActive(id, val) {
            if (!db) return;
            try {
                    const { error } = await db.from('sponsored_products').update({ is_active: val }).eq('id', id);
                    if (error) { showToast('Error: ' + error.message, 'error'); return; }
                    showToast(val ? 'Activated' : 'Deactivated', 'info');
                } catch(e) { showToast('Error: ' + (e.message || e), 'error'); }
        }

        async function deleteItem(id) {
            showConfirmationModal('Delete this sponsored product?', async () => {
                if (!db) return;
                try {
                    const { error } = await db.from('sponsored_products').delete().eq('id', id);
                    if (error) { showToast('Delete failed: ' + error.message, 'error'); return; }
                    showToast('Deleted', 'info');
                    loadProducts();
                } catch(e) { showToast('Error: ' + (e.message || e), 'error'); }
            });
        }

        (async () => {
            if (!db) return;
            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                showToast("Session expired. Please login again.", "error");
                localStorage.removeItem('merchantSessionActive');
                window.location.href = "index.html";
                return;
            }
            loadProducts();
        })();
    </script>
</body>
</html>
