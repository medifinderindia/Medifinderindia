    <!-- ✅ FIX: এই দুইটা লাইন আগে মিসিং ছিল, যার কারণে supabase-config.js এর
         supabase.createClient(...) কল ReferenceError দিয়ে ক্র্যাশ করত এবং
         window.supabaseClient কখনো সেট হতো না। ফলে splash screen সবসময়
         session না পেয়ে Login.html এ পাঠিয়ে দিত, যদিও ইউজার আগে থেকেই লগইন ছিল। -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="supabase-constants.js"></script>

    <!-- Prevent any white/blank flash before CSS paints -->
    <style>html,body{background:#ffffff;margin:0;padding:0;}</style>

    <!-- ==========================================
         Splash "once per session" gate
         Runs synchronously before anything paints. If this tab has
         already shown the splash (and not logged out since), we hide
         the splash instantly — no flash — and the main script below
         will do a silent redirect instead of the full animation.
         Mobile browsers that reload index.html on app-resume will hit
         this path instead of re-playing the splash every time.
         ========================================== -->
    <script>
        (function () {
            try {
                if (sessionStorage.getItem('mf_splash_shown')) {
                    document.documentElement.classList.add('mf-fast');
                }
            } catch (e) {
                // sessionStorage unavailable — full splash will just play normally.
            }
        })();
    </script>
    <style>/* ==========================================
   MediFinder Splash Screen
   Premium animated loading experience
   ========================================== */

:root {
    --mf-red: #e02020;
    --mf-red-dark: #b81717;
    --mf-red-soft: rgba(224, 32, 32, 0.10);
    --mf-text: #2f3542;
    --mf-muted: #8a8f98;
}

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    background: #ffffff;
}

body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
}

.splash-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
    z-index: 9999;
}

/* Fast path: this tab already showed the splash this session — hide it instantly, no flash */
html.mf-fast .splash-screen {
    display: none !important;
}

/* Soft ambient glow behind the logo, gives premium depth without imagery */
.splash-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(520px, 140vw);
    height: min(520px, 140vw);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--mf-red-soft) 0%, rgba(224, 32, 32, 0) 70%);
    animation: glowPulse 3.2s ease-in-out infinite;
    pointer-events: none;
}

@keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.94); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.04); }
}

.splash-content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 360px;
    z-index: 1;
}

/* Logo */
.logo-ring {
    width: clamp(92px, 26vw, 128px);
    height: clamp(92px, 26vw, 128px);
    border-radius: 50%;
    padding: 6px;
    background: conic-gradient(from 0deg, var(--mf-red), #ff6b6b, var(--mf-red));
    animation: ringSpin 5s linear infinite, fadeZoomIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    margin-bottom: 22px;
}

@keyframes ringSpin {
    to { transform: rotate(360deg); }
}

.logo-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(224, 32, 32, 0.18);
}

.splash-logo {
    width: 78%;
    height: 78%;
    object-fit: contain;
    animation: logoBreathe 2.4s ease-in-out infinite;
}

@keyframes fadeZoomIn {
    from { opacity: 0; transform: scale(0.55); }
    to   { opacity: 1; transform: scale(1); }
}

@keyframes logoBreathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
}

/* Title */
.splash-title {
    margin: 0;
    font-size: clamp(1.4rem, 5vw, 1.8rem);
    font-weight: 800;
    color: var(--mf-text);
    letter-spacing: -0.02em;
    animation: fadeUp 0.6s ease-out 0.15s both;
}

.splash-title span {
    color: var(--mf-red);
}

.splash-tagline {
    margin: 4px 0 26px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--mf-muted);
    animation: fadeUp 0.6s ease-out 0.25s both;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Icon stage */
.icon-stage {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
}

.splash-icon {
    font-size: 1.9rem;
    line-height: 1;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: inline-block;
}

.splash-icon.icon-hide {
    opacity: 0;
    transform: translateY(6px) scale(0.85);
}

/* Loading bar */
.loading-bar-track {
    width: min(220px, 60vw);
    height: 7px;
    background: #f1f1f4;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
}

.loading-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--mf-red-dark), var(--mf-red) 55%, #ff6b6b);
    background-size: 200% 100%;
    animation: barShimmer 1.4s linear infinite;
    transition: width 2.9s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.loading-bar-fill.fill-active {
    width: 100%;
}

@keyframes barShimmer {
    0%   { background-position: 0% 0; }
    100% { background-position: -200% 0; }
}

.loading-text {
    margin: 14px 0 0;
    font-size: 0.78rem;
    color: var(--mf-muted);
    font-weight: 500;
    letter-spacing: 0.01em;
}

.splash-footer {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    margin: 0;
    font-size: 0.72rem;
    color: #c7cad0;
    font-weight: 500;
    letter-spacing: 0.02em;
    animation: fadeUp 0.6s ease-out 0.4s both;
}

/* Exit transition: fades the whole splash out smoothly before navigation */
.splash-screen.splash-exit {
    animation: splashFadeOut 0.35s ease forwards;
}

@keyframes splashFadeOut {
    to { opacity: 0; }
}

/* Respect reduced-motion preference */
@media (prefers-reduced-motion: reduce) {
    .logo-ring,
    .splash-glow,
    .splash-logo {
        animation: none !important;
    }
    .loading-bar-fill {
        transition: width 2.9s linear;
        animation: none !important;
        background: var(--mf-red);
    }
}

@media (max-width: 360px) {
    .splash-title { font-size: 1.25rem; }
    .splash-tagline { font-size: 0.78rem; }
}</style>

    <script src="supabase-constants.js"></script>
</head>
<body>

    <div class="splash-screen" id="splash-screen">
        <div class="splash-glow"></div>

        <div class="splash-content">
            <div class="logo-ring">
                <div class="logo-circle">
                    <img src="favicon.png" alt="MediFinder" class="splash-logo" id="splash-logo">
                </div>
            </div>

            <h1 class="splash-title">Medi<span>Finder</span></h1>
            <p class="splash-tagline">Medicine in 20 Minutes</p>

            <div class="icon-stage" aria-hidden="true">
                <span class="splash-icon" id="splash-icon">💊</span>
            </div>

            <div class="loading-bar-track">
                <div class="loading-bar-fill" id="loading-bar-fill"></div>
            </div>

            <p class="loading-text" id="loading-text">Getting things ready…</p>
        </div>

        <p class="splash-footer">Trusted Medicine Delivery Web</p>
    </div>
<script>// ==========================================
// MediFinder Splash Screen Logic
// - Cycles medical icons
// - Plays the loading bar animation
// - Checks Supabase session and redirects to the
//   correct destination WITHOUT ever flashing the login page
// ==========================================
(function () {
    "use strict";

    // Splash is allowed to show for at most this long, no matter what.
    var MAX_DISPLAY_MS = 4200;
    // Splash won't disappear before this — matches the loading bar's fill
    // duration (see splash.css) so it always finishes visually before redirect.
    var MIN_DISPLAY_MS = 3000;

    var startedAt = Date.now();
    var redirected = false;

    var icons = [
        "💊", "💉", "🧴", "🩹", "🩺", "🧪", "❤️", "🫀", "🩸", "🦴",
        "🫁", "👁️", "🦷", "🧠", "👶", "🤰", "♿", "🚑", "🏥", "💉",
        "💊", "📋", "🧬", "⚕️", "🩹"
    ];
    var iconIndex = 0;
    var iconTimer = null;

    function startIconCycle() {
        var iconEl = document.getElementById("splash-icon");
        if (!iconEl) return;
        iconTimer = setInterval(function () {
            iconEl.classList.add("icon-hide");
            setTimeout(function () {
                iconIndex = (iconIndex + 1) % icons.length;
                iconEl.textContent = icons[iconIndex];
                iconEl.classList.remove("icon-hide");
            }, 200);
        }, 400);
    }

    function stopIconCycle() {
        if (iconTimer) {
            clearInterval(iconTimer);
            iconTimer = null;
        }
    }

    function startLoadingBar() {
        var fill = document.getElementById("loading-bar-fill");
        if (!fill) return;
        // Small delay so the CSS width transition reliably triggers
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                fill.classList.add("fill-active");
            });
        });
    }

    function setLoadingText(text) {
        var el = document.getElementById("loading-text");
        if (el) el.textContent = text;
    }

    function waitFor(conditionFn, timeoutMs, intervalMs) {
        return new Promise(function (resolve) {
            var waited = 0;
            (function poll() {
                if (conditionFn() || waited >= timeoutMs) {
                    resolve();
                    return;
                }
                waited += intervalMs;
                setTimeout(poll, intervalMs);
            })();
        });
    }

    // Figures out where the user should land: home.html (not logged in),
    // or the correct role home page (logged in). Reuses the exact client
    // and role logic already shipped in supabase-config.js when available,
    // so there is a single source of truth for role → destination mapping.
    async function determineDestination() {
        try {
            await waitFor(function () { return !!window.supabaseClient; }, 1200, 50);

            var client = window.supabaseClient;
            if (!client || !client.auth) {
                return "home.html";
            }

            var sessionResult = await client.auth.getSession();
            var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;

            if (!session || !session.user) {
                return "home.html";
            }

            if (typeof window.getRedirectPathForUser === "function") {
                return await window.getRedirectPathForUser(session.user);
            }

            // Fallback mapping if supabase-config.js hasn't exposed the helper
            var user = session.user;
            if (user.email === "medifinderindia@gmail.com") {
                return "adminuser.html";
            }
            var role = (user.user_metadata && user.user_metadata.role) ||
                localStorage.getItem("selected_role") || "user";
            if (role === "merchant") return "marchenthome.html";
            if (role === "delivery") return "delyvaryhome.html";
            return "userhome.html";
        } catch (err) {
            console.error("Splash session check failed:", err);
            return "home.html";
        }
    }

    // Safety valve: no matter what triggers repeated loads of this page
    // (stale cached copy, an old service worker, a PWA shell re-launching
    // at its start_url, etc.), this makes sure we NEVER auto-redirect more
    // than a few times in a short window. If that happens, we stop and show
    // a manual "Continue" link instead of silently bouncing forever.
    function tooManyRecentRedirects() {
        try {
            var raw = sessionStorage.getItem("mf_redirect_log");
            var log = raw ? JSON.parse(raw) : [];
            var now = Date.now();
            log = log.filter(function (t) { return now - t < 10000; }); // last 10s
            log.push(now);
            sessionStorage.setItem("mf_redirect_log", JSON.stringify(log));
            return log.length > 3;
        } catch (e) {
            return false;
        }
    }

    function showManualContinue(path) {
        console.warn("MediFinder splash: too many redirects in a short window — stopping auto-redirect. If you keep seeing this, clear your browser cache / uninstall+reinstall the PWA, or check for a stale service worker.");
        stopIconCycle();
        document.documentElement.classList.remove("mf-fast");
        var splash = document.getElementById("splash-screen");
        if (splash) splash.classList.remove("splash-exit");
        setLoadingText("Taking longer than usual…");
        var track = document.querySelector(".loading-bar-track");
        if (track) {
            var link = document.createElement("a");
            link.href = path;
            link.textContent = "Tap to continue";
            link.style.cssText = "display:inline-block;margin-top:16px;color:#e02020;font-weight:700;font-size:0.85rem;text-decoration:underline;";
            track.parentNode.insertBefore(link, track.nextSibling);
        }
    }

    function safeRedirect(path) {
        if (tooManyRecentRedirects()) {
            showManualContinue(path);
            return;
        }
        window.location.replace(path);
    }

    function goTo(path) {
        if (redirected) return;
        redirected = true;
        stopIconCycle();

        var splash = document.getElementById("splash-screen");
        if (splash) splash.classList.add("splash-exit");

        setTimeout(function () {
            safeRedirect(path);
        }, 320);
    }

    async function init() {
        // Fast path: this tab already played the splash this session (and hasn't
        // logged out since — see the SIGNED_OUT handler in supabase-config.js,
        // which clears this flag). Skip the animation entirely and just redirect
        // silently. The .mf-fast class (set synchronously in <head>) already
        // hid the splash markup, so there's no visual flash either.
        var alreadyShown = false;
        try {
            alreadyShown = !!sessionStorage.getItem("mf_splash_shown");
        } catch (e) {
            alreadyShown = false;
        }

        if (alreadyShown) {
            var quickDestination = await determineDestination();
            safeRedirect(quickDestination);
            return;
        }

        try {
            sessionStorage.setItem("mf_splash_shown", "1");
        } catch (e) {
            // sessionStorage unavailable — splash will just play every time, harmless.
        }

        startIconCycle();
        startLoadingBar();

        // Hard cap: never let the splash (or the redirect decision) exceed MAX_DISPLAY_MS
        var hardCap = new Promise(function (resolve) {
            setTimeout(function () { resolve("home.html"); }, MAX_DISPLAY_MS - 200);
        });

        var destination = await Promise.race([determineDestination(), hardCap]);


        setLoadingText("Almost there…");

        var elapsed = Date.now() - startedAt;
        var remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);

        setTimeout(function () {
            goTo(destination);
        }, remaining);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();</script>
    <!-- Existing production auth logic (session client, role redirect helpers). Not modified in behavior. -->
    <script src="supabase-config.js?v=13"></script>
