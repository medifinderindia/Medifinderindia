         Splash "once per session" gate
         Runs synchronously before anything paints. If this tab has

    <style>/* ==========================================
   MediFinder India Splash Screen
   Premium animated loading experience
   ========================================== */

:root {
    --mf-red: #e02020;
    --mf-red-dark: #b81717;
    --mf-red-soft: rgba(224, 32, 32, 0.10);
    --mf-text: #2f3542;
    --mf-muted: #8a8f98;
    --mf-gold: #c9a24b;
    --mf-gold-soft: rgba(201, 162, 75, 0.14);
}

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    background: #ffffff;
}

body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
}

.splash-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
    z-index: 9999;
}

/* Fast path: this tab already showed the splash this session — hide it instantly, no flash */
html.mf-fast .splash-screen {
    display: none !important;
}

/* Soft ambient glow behind the logo — a single premium bloom on entrance,
   then it settles and holds steady (no endless pulsing). */
.splash-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(520px, 140vw);
    height: min(520px, 140vw);
    transform: translate(-50%, -50%) scale(0.85);
    background: radial-gradient(circle, var(--mf-red-soft) 0%, rgba(224, 32, 32, 0) 70%);
    opacity: 0;
    animation: glowBloom 1.6s ease-out 0.1s both;
    pointer-events: none;
}

@keyframes glowBloom {
    0%   { opacity: 0;    transform: translate(-50%, -50%) scale(0.85); }
    55%  { opacity: 0.85; transform: translate(-50%, -50%) scale(1.02); }
    100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
}

/* Extremely subtle ambient plus-symbols — decorative only, contained inside
   the splash screen so they vanish automatically with the exit fade. */
.splash-particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.mf-particle {
    position: absolute;
    color: var(--mf-red);
    font-weight: 700;
    opacity: 0.07;
    font-size: 1.1rem;
    line-height: 1;
    animation: particleFloat 13s ease-in-out infinite;
}

.mf-particle:nth-child(1) { top: 12%; left: 14%; font-size: 0.9rem;  animation-duration: 13s;   animation-delay: 0s; }
.mf-particle:nth-child(2) { top: 22%; left: 82%; font-size: 1.3rem;  animation-duration: 15s;   animation-delay: 1.2s; }
.mf-particle:nth-child(3) { top: 68%; left: 8%;  font-size: 1rem;    animation-duration: 11s;   animation-delay: 2.4s; }
.mf-particle:nth-child(4) { top: 78%; left: 88%; font-size: 0.85rem; animation-duration: 14s;   animation-delay: 0.6s; }
.mf-particle:nth-child(5) { top: 40%; left: 4%;  font-size: 1.1rem;  animation-duration: 16s;   animation-delay: 3s; }
.mf-particle:nth-child(6) { top: 85%; left: 45%; font-size: 0.95rem; animation-duration: 12.5s; animation-delay: 1.8s; }

@keyframes particleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-16px) rotate(8deg); }
}

.splash-content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 360px;
    z-index: 1;
}

/* Logo */
.logo-ring {
    width: clamp(92px, 26vw, 128px);
    height: clamp(92px, 26vw, 128px);
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(145deg, var(--mf-red) 0%, var(--mf-red-dark) 55%, var(--mf-gold) 100%);
    box-shadow: 0 10px 30px rgba(224, 32, 32, 0.16), 0 2px 8px rgba(201, 162, 75, 0.20);
    animation: fadeZoomIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
}

.logo-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(224, 32, 32, 0.18);
}

.splash-logo {
    width: 78%;
    height: 78%;
    object-fit: contain;
    opacity: 0;
    animation: logoReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
}

@keyframes fadeZoomIn {
    from { opacity: 0; transform: scale(0.55); }
    to   { opacity: 1; transform: scale(1); }
}

/* Logo starts soft and slightly small, then smoothly sharpens into place */
@keyframes logoReveal {
    0%   { opacity: 0; transform: scale(0.8); filter: blur(6px); }
    60%  { opacity: 1; filter: blur(0px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0px); }
}

/* Title */
.splash-title {
    margin: 0;
    font-size: clamp(1.4rem, 5vw, 1.8rem);
    font-weight: 800;
    color: var(--mf-text);
    letter-spacing: -0.02em;
    animation: fadeUp 0.6s ease-out 0.5s both;
}

.splash-title span {
    color: var(--mf-red);
}

.splash-title .mf-india {
    color: var(--mf-gold);
    font-weight: 700;
    letter-spacing: 0.01em;
}

.splash-accent-bar {
    width: 46px;
    height: 3px;
    margin: 10px auto 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff9933 0%, #ffffff 50%, #138808 100%);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.04);
    animation: fadeUp 0.6s ease-out 0.62s both;
}

.splash-tagline {
    margin: 10px 0 6px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--mf-muted);
    animation: fadeUp 0.6s ease-out 0.72s both;
}

.splash-welcome {
    margin: 0 0 24px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--mf-text);
    opacity: 0.82;
    animation: fadeUp 0.6s ease-out 0.82s both;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Icon stage */
.icon-stage {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
}

.splash-icon {
    font-size: 1.9rem;
    line-height: 1;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: inline-block;
}

.splash-icon.icon-hide {
    opacity: 0;
    transform: translateY(6px) scale(0.85);
}

/* Loading bar */
.loading-bar-track {
    width: min(220px, 60vw);
    height: 7px;
    background: #f1f1f4;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
}

.loading-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--mf-red-dark), var(--mf-red) 60%, var(--mf-gold));
    transition: width 2.9s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.loading-bar-fill.fill-active {
    width: 100%;
}

.loading-text {
    margin: 14px 0 0;
    font-size: 0.78rem;
    color: var(--mf-muted);
    font-weight: 500;
    letter-spacing: 0.01em;
}

.splash-footer {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    margin: 0;
    font-size: 0.72rem;
    color: #c7cad0;
    font-weight: 500;
    letter-spacing: 0.02em;
    animation: fadeUp 0.6s ease-out 0.9s both;
}

/* Exit transition: fades the whole splash out and gently settles the
   content with a slight scale-down before navigation. */
.splash-screen.splash-exit {
    animation: splashFadeOut 0.32s ease forwards;
}

.splash-screen.splash-exit .splash-content {
    animation: contentSettle 0.32s ease forwards;
}

@keyframes splashFadeOut {
    to { opacity: 0; }
}

@keyframes contentSettle {
    to { opacity: 0; transform: scale(0.97); }
}

/* Respect reduced-motion preference */
@media (prefers-reduced-motion: reduce) {
    .logo-ring,
    .splash-glow,
    .splash-logo,
    .splash-icon,
    .mf-particle,
    .splash-content {
        animation: none !important;
    }
    .splash-glow { opacity: 0.5; }
    .splash-logo { opacity: 1; filter: none; transform: none; }
    .loading-bar-fill {
        transition: width 2.9s linear;
        animation: none !important;
        background: var(--mf-red);
    }
}

@media (max-width: 360px) {
    .splash-title { font-size: 1.25rem; }
    .splash-tagline { font-size: 0.78rem; }
}</style>

tion","name":"How fast is delivery?","acceptedAnswer":{"@type":"Answer","text":"Our aim is fast delivery (Medicine in 30+ Minutes). Actual time depends on the pharmacy's distance, medicine availability and road conditions, so timings are not guaranteed."}},{"@type":"Question","name":"What is the delivery charge?","acceptedAnswer":{"@type":"Answer","text":"Delivery charges depend on your distance from the pharmacy and the order value. The exact charge is shown on the checkout page before you pay."}},{"@type":"Question","name":"How do I track my order?","acceptedAnswer":{"@type":"Answer","text":"Go to My Orders and tap Track on any active order to see the live delivery status and location on the map."}},{"@type":"Question","name":"How do I cancel an order?","acceptedAnswer":{"@type":"Answer","text":"Open My Orders, select the order and tap Cancel. Orders that are already out for delivery may not be cancellable."}},{"@type":"Question","name":"Which payment methods are accepted?","acceptedAnswer":{"@type":"Answer","text":"You can pay by UPI, card or Cash on Delivery (COD)."}},{"@type":"Question","name":"My payment failed but the amount was deducted. What should I do?","acceptedAnswer":{"@type":"Answer","text":"If a payment fails after the amount was deducted, it is automatically reversed to your account within 24-48 hours. If it is not reversed after that, please contact support."}},{"@type":"Question","name":"What is the refund policy?","acceptedAnswer":{"@type":"Answer","text":"Refunds for cancelled or returned orders are processed back to your original payment method, typically within 5-7 business days. Please read our Refund & Cancellation policy for full details."}},{"@type":"Question","name":"What is the return policy?","acceptedAnswer":{"@type":"Answer","text":"Damaged, expired or incorrect items can be returned within 24 hours of delivery. Medicines cannot be returned once the seal is opened, except in case of a genuine error."}},{"@type":"Question","name":"How // MediFinder Splash Screen Logic
// - Cycles medical icons

// - Checks Supabase session and redirects to the

(function () {
    "use strict";

    // Splash is allowed to show for at most this long, no matter what.

    var startedAt = Date.now();
    var redirected = false;

    // Returning from Google sign-in? (Supabase may land on this page when auth.html's
    // redirect URL isn't allow-listed.) In that case we must NEVER fall back to
    // home.html — we wait for the real session, resolve the role and go straight to
    // the role page (or back to login if the role doesn't match).
    var isOAuthReturn = false;
    try {
        isOAuthReturn = sessionStorage.getItem("mf_oauth_pending") === "1" ||
            /[?&]code=/.test(window.location.search) ||
            /access_token=/.test(window.location.hash);
    } catch (e) {}
    if (isOAuthReturn) {
        MIN_DISPLAY_MS = 0;
        MAX_DISPLAY_MS = 12000;
    }

    // A slow, meaningful journey instead of a fast random icon shuffle:
    // Medicine -> Location -> Pharmacy -> Delivery -> Customer.
    var journey = ["💊", "📍", "🏪", "🚴", "🏠"];
    var journeyIndex = 0;
    var journeyTimer = null;

    function startIconCycle() {
        var iconEl = document.getElementById("splash-icon");
        if (!iconEl) return;
        journeyTimer = setInterval(function () {
            iconEl.classList.add("icon-hide");
            setTimeout(function () {
                journeyIndex = (journeyIndex + 1) % journey.length;
                iconEl.textContent = journey[journeyIndex];
                iconEl.classList.remove("icon-hide");
            }, 250);
        }, 850);
    }

    function stopIconCycle() {
        if (journeyTimer) {
            clearInterval(journeyTimer);
            journeyTimer = null;
        }
    }

    // Cosmetic status line — purely visual reassurance while the real
    // session check (below) runs; never claims a step that didn't happen.
    var statusMessages = [
        "Checking your session…",
        "Finding nearby pharmacies…",
        "Preparing your medicines…",
        "Securing your experience…",
        "Almost ready…"
    ];
    var statusIndex = 0;
    var statusTimer = null;

    function startStatusCycle() {
        statusTimer = setInterval(function () {
            statusIndex = (statusIndex + 1) % statusMessages.length;
            setLoadingText(statusMessages[statusIndex]);
        }, 900);
    }

    function stopStatusCycle() {
        if (statusTimer) {
            clearInterval(statusTimer);
            statusTimer = null;
        }
    }

    // Sets the welcome line using the session data already fetched by
    // determineDestination() below — no extra Supabase query, no delay.
    function updateWelcomeMessage(user) {
        var el = document.getElementById("splash-welcome");
        if (!el) return;
        if (user) {
            var meta = user.user_metadata || {};
            var name = meta.full_name || meta.name || meta.first_name || null;
            el.textContent = name ? ("Welcome back, " + name) : "Welcome back";
        } else {
            el.textContent = "Your health in safe hands.";
        }
    }

    function startLoadingBar() {
        var fill = document.getElementById("loading-bar-fill");
        if (!fill) return;
        // Small delay so the CSS width transition reliably triggers
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                fill.classList.add("fill-active");
            });
        });
    }

    function setLoadingText(text) {
        var el = document.getElementById("loading-text");
        if (el) el.textContent = text;
    }

    function waitFor(conditionFn, timeoutMs, intervalMs) {
        return new Promise(function (resolve) {
            var waited = 0;
            (function poll() {
                if (conditionFn() || waited >= timeoutMs) {
                    resolve();
                    return;
                }
                waited += intervalMs;
                setTimeout(poll, intervalMs);
            })();
        });
    }

    // Figures out where the user should land: home.html (not logged in),
    // or the correct role home page (logged in). Reuses the exact client
    // and role logic already shipped in supabase-config.js when available,
    // so there is a single source of truth for role → destination mapping.
    async function determineDestination() {
        try {
            await waitFor(function () { return !!window.supabaseClient; }, 1200, 50);

            // Already logged in on this device? Role + service_type are stored locally,
            // so go straight to the person's own page: no network, no slow-connection
            // fallback to home.html.
            if (!isOAuthReturn && typeof window.mfRouteFromCache === "function") {
                var cached = window.mfRouteFromCache();
                if (cached) {
                    try { updateWelcomeMessage(JSON.parse(localStorage.getItem(Object.keys(localStorage).filter(function (k) { return /^sb-.*-auth-token/.test(k); })[0]) || "null").user); } catch (e) {}
                    return cached;
                }
            }

            var client = window.supabaseClient;
            if (!client || !client.auth) {
                updateWelcomeMessage(null);
                return "home.html";
            }

            var sessionResult = await client.auth.getSession();
            var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;

            // Google just returned: the token in the URL may still be being parsed.
            // Poll briefly instead of deciding "guest" too early.
            if (isOAuthReturn) {
                for (var i = 0; i < 40 && (!session || !session.user); i++) {
                    await new Promise(function (r) { setTimeout(r, 200); });
                    sessionResult = await client.auth.getSession();
                    session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
                }
            }

            if (!session || !session.user) {
                updateWelcomeMessage(null);
                return isOAuthReturn ? "auth.html?panel=login" : "home.html";
            }

            updateWelcomeMessage(session.user);

            if (typeof window.getRedirectPathForUser === "function") {
                return await window.getRedirectPathForUser(session.user);
            }

            // Fallback mapping if supabase-config.js hasn't exposed the helper
            var user = session.user;
            if (user.email === "medifinderindia@gmail.com") {
                return "admin.html";
            }
            var role = (user.user_metadata && user.user_metadata.role) ||
                localStorage.getItem("selected_role") || "user";
            if (role === "merchant") return "marchent.html";
            if (role === "delivery") return "rider.html";
            return "user.html";   // logged in: never fall back to the public home
        } catch (err) {
            console.error("Splash session check failed:", err);
            updateWelcomeMessage(null);
            if (isOAuthReturn) return "auth.html?panel=login";
            // network/Supabase error: a logged-in person must still land on their own page
            return (window.mfRouteFromCache && window.mfRouteFromCache()) ||
                   (window.mfHasSession && window.mfHasSession() ? "user.html" : "home.html");
        }
    }

    // Safety valve: no matter what triggers repeated loads of this page
    // (stale cached copy, an old service worker, a PWA shell re-launching
    // at its start_url, etc.), this makes sure we NEVER auto-redirect more
    // than a few times in a short window. If that happens, we stop and show
    // a manual "Continue" link instead of silently bouncing forever.
    function tooManyRecentRedirects() {
        try {
            var raw = sessionStorage.getItem("mf_redirect_log");
            var log = raw ? JSON.parse(raw) : [];
            var now = Date.now();
            log = log.filter(function (t) { return now - t < 10000; }); // last 10s
            log.push(now);
            sessionStorage.setItem("mf_redirect_log", JSON.stringify(log));
            return log.length > 3;
        } catch (e) {
            return false;
        }
    }

    function showManualContinue(path) {
        console.warn("MediFinder splash: too many redirects in a short window — stopping auto-redirect. If you keep seeing this, clear your browser cache / uninstall+reinstall the PWA, or check for a stale service worker.");
        stopIconCycle();
        stopStatusCycle();
        document.documentElement.classList.remove("mf-fast");
        var splash = document.getElementById("splash-screen");
        if (splash) splash.classList.remove("splash-exit");
        setLoadingText("Taking longer than usual…");
        var track = document.querySelector(".loading-bar-track");
        if (track) {
            var link = document.createElement("a");
            link.href = path;
            link.textContent = "Tap to continue";
            link.style.cssText = "display:inline-block;margin-top:16px;color:#e02020;font-weight:700;font-size:0.85rem;text-decoration:underline;";
            track.parentNode.insertBefore(link, track.nextSibling);
        }
    }

    function safeRedirect(path) {
        if (tooManyRecentRedirects()) {
            showManualContinue(path);
            return;
        }
        window.location.replace(path);
    }

    function goTo(path) {
        if (redirected) return;
        redirected = true;
        stopIconCycle();
        stopStatusCycle();

        var splash = document.getElementById("splash-screen");
        if (splash) splash.classList.add("splash-exit");

        setTimeout(function () {
            safeRedirect(path);
        }, 320);
    }

    async function init() {
        // Fast path: this tab already played the splash this session (and hasn't
        // logged out since — see the SIGNED_OUT handler in supabase-config.js,
        // which clears this flag). Skip the animation entirely and just redirect
        // silently. The .mf-fast class (set synchronously in <head>) already
        // hid the splash markup, so there's no visual flash either.
        var alreadyShown = false;
        try {
            alreadyShown = !!sessionStorage.getItem("mf_splash_shown");
        } catch (e) {
            alreadyShown = false;
        }

        if (alreadyShown) {
            var quickDestination = await determineDestination();
            safeRedirect(quickDestination);
            return;
        }

        try {
            sessionStorage.setItem("mf_splash_shown", "1");
        } catch (e) {
            // sessionStorage unavailable — splash will just play every time, harmless.
        }

        startIconCycle();
        startStatusCycle();
        startLoadingBar();

        // Hard cap: never let the splash (or the redirect decision) exceed MAX_DISPLAY_MS
        // A logged-in person must NEVER time out into the public home.html.
        var hasSess = !!(window.mfHasSession && window.mfHasSession());
        var capMs = (hasSess && !isOAuthReturn && !(window.mfRouteFromCache && window.mfRouteFromCache())) ? 9000 : MAX_DISPLAY_MS - 200;
        var hardCap = new Promise(function (resolve) {
            setTimeout(function () {
                if (isOAuthReturn) return resolve("auth.html?panel=login");
                resolve((window.mfRouteFromCache && window.mfRouteFromCache()) || (hasSess ? "user.html" : "home.html"));
            }, capMs);
        });

        var destination = await Promise.race([determineDestination(), hardCap]);

        stopStatusCycle();
        setLoadingText("Almost ready…");

        var elapsed = Date.now() - startedAt;
        var remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);

        setTimeout(function () {
            goTo(destination);
        }, remaining);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();</script>
    <!-- Existing production auth logic (session client, role redirect helpers). Not modified in behavior. -->
