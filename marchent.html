<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
    <title>Merchant Dashboard | MediFinder India</title>
    <meta name="description" content="MediFinder India merchant panel for pharmacies.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://medifinderindia.com/marchent.html">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MediFinder India">
    <meta property="og:locale" content="en_IN">
    <meta property="og:url" content="https://medifinderindia.com/marchent.html">
    <meta property="og:title" content="Merchant Dashboard | MediFinder India">
    <meta property="og:description" content="MediFinder India merchant panel for pharmacies.">
    <meta property="og:image" content="https://medifinderindia.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Merchant Dashboard | MediFinder India">
    <meta name="twitter:description" content="MediFinder India merchant panel for pharmacies.">
    <meta name="twitter:image" content="https://medifinderindia.com/og-image.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>try{if(localStorage.getItem("mf_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="marchent.css?v=2">
</head>
<body>

<!-- ============ APP SHELL ============ -->
<div id="app">

  <!-- ============ DESKTOP SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img class="brand-logo" src="favicon.png" alt="MediFinder India">
      <span class="brand-name">MediFinder India</span>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- filled by JS -->
    </nav>

    <button class="sidebar-merchant" id="sidebarMerchant" data-route="profile">
      <img id="sidebarShopPhoto" class="sidebar-merchant-photo" alt="">
      <div class="sidebar-merchant-info">
        <span class="sidebar-merchant-name" id="sidebarShopName">—</span>
        <span class="sidebar-merchant-status" id="sidebarKycBadge">—</span>
      </div>
    </button>
  </aside>

  <!-- ============ MAIN COLUMN ============ -->
  <div class="main-col">

    <!-- ============ HEADER ============ -->
    <header class="topbar">
      <div class="topbar-brand only-mobile">
        <img class="brand-logo small" src="favicon.png" alt="MediFinder India">
        <span class="topbar-shop-name" id="topbarShopName">MediFinder India</span>
      </div>

      <div class="topbar-title only-desktop" id="topbarTitle">Dashboard</div>

      <div class="topbar-actions">
        <button class="rx-shortcut" data-route="prescription" title="Prescription requests">
          <svg viewBox="0 0 24 24"><path d="M9 2h6v4H9zM7 6h10v16H7z"/><path d="M9 11h6M9 15h4"/></svg>
          <span class="only-desktop">RX</span>
          <span class="badge-dot" id="rxBadge" hidden></span>
        </button>
        <button class="icon-btn" data-route="notifications" title="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="badge-count" id="notifBadge" hidden>0</span>
        </button>
      </div>
    </header>

    <!-- ============ PAGE OUTLET ============ -->
    <main class="page-outlet" id="pageOutlet">
      <!-- pages rendered by JS -->
    </main>

    <!-- ============ MOBILE BOTTOM NAV ============ -->
    <nav class="bottom-nav only-mobile" id="bottomNav">
      <!-- filled by JS -->
    </nav>
  </div>

  <!-- ============ MOBILE SIDEBAR DRAWER (More menu) ============ -->
  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="moreDrawer">
    <div class="drawer-head">
      <span>More</span>
      <button class="icon-btn" id="drawerClose" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav class="drawer-nav" id="drawerNav"></nav>
  </aside>

  <!-- ============ TOAST ============ -->
  <div class="toast" id="toast" hidden></div>

  <!-- ============ CONFIRM DIALOG ============ -->
  <div class="modal-scrim" id="confirmScrim" hidden>
    <div class="modal confirm-modal" role="alertdialog" aria-modal="true">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p id="confirmBody"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>

</div>

<script src="permission-every.js?v=4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
<script src="supabase-constants.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="marchent.js"></script>
<script src="push-notifications.js?v=4" defer></script>
</body>
</html>
