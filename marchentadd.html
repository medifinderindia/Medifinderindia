<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e02020">
    <title>Add Medicine - Medi Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="marchentadd.css?v=13">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="supabase-constants.js"></script>
    <script src="prod-utils.js?v=13"></script>
    <link rel="stylesheet" href="merchant-shared.css?v=14">
</head>
<body>
    <div class="container">
        <main class="main-content">
            <header class="top-bar">
                <div class="logo-area">
                    <img src="1779304435608.png" alt="Logo">
                    <h1>MEDI <span class="highlight">FINDER</span></h1>
                </div>
            </header>

            <section class="content-body">
                <div class="form-container">
                    <div class="form-steps">
                        <div class="step active" id="ind-1"><span class="step-num">1</span> BASICS</div>
                        <div class="step-line" id="line-1"></div>
                        <div class="step" id="ind-2"><span class="step-num">2</span> INFO</div>
                        <div class="step-line" id="line-2"></div>
                        <div class="step" id="ind-3"><span class="step-num">3</span> ASSETS</div>
                    </div>

                    <form id="medicineForm" onsubmit="return false;">
                        
                        <div class="step-panel active" id="step-panel-1">
                            <div class="form-group">
                                <label class="section-label">Product Type</label>
                                <div class="type-toggle" id="typeToggle">
                                    <label class="type-option active" id="typeOptMedicine">
                                        <input type="radio" name="productType" value="Medicine" checked onchange="setProductType('Medicine')">
                                        <i class="fa-solid fa-pills"></i>Medicine
                                    </label>
                                    <label class="type-option" id="typeOptInstrument">
                                        <input type="radio" name="productType" value="Instrument" onchange="setProductType('Instrument')">
                                        <i class="fa-solid fa-kit-medical"></i>Instrument
                                    </label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="section-label">Product Images (Upload up to 4 Photos)</label>
                                <div class="image-upload-grid">
                                    <div class="upload-box main-box" onclick="document.getElementById('fileInput1').click()">
                                        <i class="fa-solid fa-camera-retro"></i>
                                        <p>Main Photo</p>
                                        <img id="imagePreview1" alt="Preview 1">
                                        <input type="file" id="fileInput1" accept="image/*" style="display: none;" onchange="previewImage(this, 'imagePreview1')">
                                    </div>
                                    <div class="upload-box" onclick="document.getElementById('fileInput2').click()">
                                        <i class="fa-solid fa-plus"></i>
                                        <p>Side / Back</p>
                                        <img id="imagePreview2" alt="Preview 2">
                                        <input type="file" id="fileInput2" accept="image/*" style="display: none;" onchange="previewImage(this, 'imagePreview2')">
                                    </div>
                                    <div class="upload-box" onclick="document.getElementById('fileInput3').click()">
                                        <i class="fa-solid fa-plus"></i>
                                        <p>Composition</p>
                                        <img id="imagePreview3" alt="Preview 3">
                                        <input type="file" id="fileInput3" accept="image/*" style="display: none;" onchange="previewImage(this, 'imagePreview3')">
                                    </div>
                                    <div class="upload-box" onclick="document.getElementById('fileInput4').click()">
                                        <i class="fa-solid fa-plus"></i>
                                        <p>Max Retail Price</p>
                                        <img id="imagePreview4" alt="Preview 4">
                                        <input type="file" id="fileInput4" accept="image/*" style="display: none;" onchange="previewImage(this, 'imagePreview4')">
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" id="prodName" placeholder="Enter medicine name (e.g., Napa Extend)" required>
                            </div>

                            <div class="form-group medicine-only" id="compositionGroup">
                                <label>Composition / Salt Name</label>
                                <input type="text" id="composition" placeholder="e.g., Paracetamol 650mg + Caffeine 30mg">
                            </div>
                        </div>

                        <div class="step-panel" id="step-panel-2">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Category</label>
                                    <select id="dosageForm" required></select>
                                </div>
                                <div class="form-group medicine-only">
                                    <label>Strength / Power</label>
                                    <input type="text" id="strength" placeholder="e.g., 650mg, 100ml, 5gm">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Manufacturer Company Name</label>
                                    <input type="text" id="manufacturer" placeholder="e.g., Beximco Pharmaceuticals" required>
                                </div>
                                <div class="form-group">
                                    <label>Brand Name</label>
                                    <input type="text" id="brandName" placeholder="e.g., Napa">
                                </div>
                            </div>

                            <div class="form-row medicine-only">
                                <div class="form-group">
                                    <label>Prescription Required?</label>
                                    <select id="prescriptionReq">
                                        <option value="No">No (OTC Drug)</option>
                                        <option value="Yes">Yes (Rx Required)</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Batch Number</label>
                                    <input type="text" id="batchNumber" placeholder="Enter Batch No">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Product Description</label>
                                <textarea id="productDescription" rows="3" placeholder="Describe your product - uses, benefits, how to take, precautions..."></textarea>
                            </div>

                            <div class="form-row medicine-only">
                                <div class="form-group">
                                    <label>MFD (Month / Year)</label>
                                    <input type="month" id="mfdDate">
                                </div>
                                <div class="form-group">
                                    <label>Expiry (Month / Year)</label>
                                    <input type="month" id="expiryDate">
                                </div>
                            </div>

                            <div class="form-row medicine-only">
                                <div class="form-group">
                                    <label>Lot Number <span style="color:#a0aec0;font-weight:400;">(Optional)</span></label>
                                    <input type="text" id="lotNumber" placeholder="Enter Lot No">
                                </div>
                            </div>

                            <div class="form-row instrument-only">
                                <div class="form-group">
                                    <label>Warranty Period</label>
                                    <select id="warrantyPeriod">
                                        <option value="No Warranty">No Warranty</option>
                                        <option value="3 Months">3 Months</option>
                                        <option value="6 Months">6 Months</option>
                                        <option value="1 Year">1 Year</option>
                                        <option value="2 Years">2 Years</option>
                                        <option value="5 Years">5 Years</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Model Number</label>
                                    <input type="text" id="modelNumber" placeholder="e.g., BP-A200 (Optional)">
                                </div>
                            </div>
                        </div>

                        <div class="step-panel" id="step-panel-3">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>MRP (Maximum Retail Price) INR</label>
                                    <input type="number" id="mrpPrice" step="0.01" placeholder="₹ 0.00" oninput="calcDiscount()">
                                </div>
                                <div class="form-group">
                                    <label>Selling Price (INR)</label>
                                    <input type="number" id="unitPrice" step="0.01" placeholder="₹ 0.00" required oninput="calcDiscount()">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Discount %</label>
                                    <input type="number" id="discountPct" step="1" min="0" max="90" placeholder="Auto-calculated" readonly style="background:#f5f6fa;color:#e02020;font-weight:700">
                                </div>
                                <div class="form-group">
                                    <label>Drug Type</label>
                                    <select id="drugType" required>
                                        <option value="Branded">Branded Medicine</option>
                                        <option value="Generic">Generic Medicine</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Stock Qty</label>
                                    <input type="number" id="stockQty" placeholder="Total units available" required>
                                </div>
                                <div class="form-group">
                                    <label>Unit Type</label>
                                    <input type="text" id="unitType" placeholder="e.g., Strip, Pcs, Bottle" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Rack / Shelf Location</label>
                                    <input type="text" id="rackLocation" placeholder="e.g., A-12, Shelf-3 (Optional)">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Short Description & Side Effects</label>
                                <textarea id="sideEffects" rows="3" placeholder="Enter basic guidelines, dosage info or prominent side effects..."></textarea>
                            </div>
                        </div>

                        <div class="form-footer">
                            <button type="button" class="btn-back" id="btnBack" disabled>
                                <i class="fa-solid fa-arrow-left"></i> Previous
                            </button>
                            
                            <button type="button" class="btn-draft" id="btnDraft" title="Save details for later">
                                <i class="fa-regular fa-bookmark"></i> Save Draft
                            </button>
                            
                            <button type="button" class="btn-next" id="btnNext">
                                Next <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" href="marchenthome.html"><i class="fas fa-home"></i><span>HOME</span></a>
        <a class="nav-item" href="marchentorders.html"><i class="fas fa-box"></i><span>ORDERS</span></a>
        <a class="nav-add active" href="marchentadd.html">
            <div class="nav-add-btn"><i class="fas fa-plus"></i></div>
            <span>ADD</span>
        </a>
        <a class="nav-item" href="marchentinventory.html"><i class="fas fa-capsules"></i><span>INVENTORY</span></a>
        <a class="nav-item" href="marchentprofile.html"><i class="fas fa-user-circle"></i><span>PROFILE</span></a>
    </nav>

    <script>
        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    input.parentElement.classList.add('has-img');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
        function calcDiscount() {
            const mrp = parseFloat(document.getElementById('mrpPrice').value) || 0;
            const price = parseFloat(document.getElementById('unitPrice').value) || 0;
            const disc = document.getElementById('discountPct');
            if (mrp > 0 && price > 0 && price < mrp) {
                disc.value = Math.round(((mrp - price) / mrp) * 100);
            } else {
                disc.value = '';
            }
        }

        // 🩺 প্রোডাক্ট টাইপ টগল — Medicine vs Instrument
        const CATEGORY_OPTIONS = {
            Medicine: [
                ["", "Select Category"], ["Syrup", "Syrup"], ["Tablet", "Tablet"],
                ["Lotion", "Lotion"], ["Baby", "Baby"], ["Insulin", "Insulin"],
                ["Food", "Food"], ["Other", "Other"]
            ],
            Instrument: [
                ["", "Select Category"], ["Thermometer", "Thermometer"], ["BP Monitor", "BP Monitor"],
                ["Glucometer", "Glucometer"], ["Nebulizer", "Nebulizer"], ["Oxygen Concentrator", "Oxygen Concentrator"],
                ["Wheelchair & Mobility Aid", "Wheelchair & Mobility Aid"], ["Walking Stick / Crutches", "Walking Stick / Crutches"],
                ["First Aid & Dressing", "First Aid & Dressing"], ["Syringe & Needle", "Syringe & Needle"],
                ["Surgical Instrument", "Surgical Instrument"], ["Hearing Aid", "Hearing Aid"],
                ["Other Medical Equipment", "Other Medical Equipment"]
            ]
        };
        window.currentProductType = 'Medicine';
        function setProductType(type) {
            window.currentProductType = type;
            document.getElementById('typeOptMedicine').classList.toggle('active', type === 'Medicine');
            document.getElementById('typeOptInstrument').classList.toggle('active', type === 'Instrument');

            document.querySelectorAll('.medicine-only').forEach(el => el.style.display = (type === 'Medicine') ? '' : 'none');
            document.querySelectorAll('.instrument-only').forEach(el => el.style.display = (type === 'Instrument') ? '' : 'none');

            // ওষুধ না হলে কম্পোজিশন খালি করে দাও যাতে ভুল করে ইনস্ট্রুমেন্টে সল্ট সেভ না হয়
            if (type !== 'Medicine') { const c = document.getElementById('composition'); if (c) c.value = ''; }

            const sel = document.getElementById('dosageForm');
            const opts = CATEGORY_OPTIONS[type] || CATEGORY_OPTIONS.Medicine;
            sel.innerHTML = opts.map(([val, label]) => `<option value="${val}">${label}</option>`).join('');
        }

        setProductType('Medicine'); // পেজ লোড হবার সাথে সাথে ডিফল্ট ক্যাটাগরি ও ফিল্ড ভিজিবিলিটি বসিয়ে দাও
    </script>
    <script src="marchentscript.js?v=13"></script>
</body>
</html>
