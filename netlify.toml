[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/userhome"
  to = "/userhome.html"
  status = 200

[[redirects]]
  from = "/userorder"
  to = "/userorder.html"
  status = 200

[[redirects]]
  from = "/usercart"
  to = "/usercart.html"
  status = 200

[[redirects]]
  from = "/merchant"
  to = "/marchenthome.html"
  status = 200

[[redirects]]
  from = "/delivery"
  to = "/delyvaryhome.html"
  status = 200