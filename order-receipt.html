<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice | MediFinder India</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#111;padding:24px}
.invoice-wrap{width:min(100%,980px);margin:auto;background:#fff;box-shadow:0 8px 40px #0008}
.invoice{padding:20px 24px 24px}
.top-title{text-align:center;font-size:12px;font-weight:700;margin-bottom:10px}
.top-grid{display:grid;grid-template-columns:1.15fr 1.15fr .75fr;border:1px solid #222}
.box{padding:8px;border-right:1px solid #222;min-height:150px}
.box:last-child{border-right:0}
.box h3{font-size:11px;text-transform:uppercase;margin-bottom:5px}
.box p{font-size:10px;line-height:1.45}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.brand img{width:42px;height:42px;object-fit:contain}
.brand b{font-size:16px;color:#e02020}
.brand small{display:block;color:#555;font-size:8px}
.invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:6px}
.invoice-meta div{font-size:10px}
.label{color:#555}
.value{font-weight:700}
.qr{width:105px;height:105px;display:block;margin:5px auto 3px;border:1px solid #ddd;padding:3px}
.qr-note{text-align:center;font-size:8px;color:#555}
.section{border:1px solid #222;border-top:0}
.section-title{background:#f3f4f6;border-bottom:1px solid #222;padding:6px 8px;font-size:10px;font-weight:700;text-transform:uppercase}
.customer-grid{display:grid;grid-template-columns:1fr 1fr}
.customer{padding:8px;border-right:1px solid #222;min-height:82px}
.customer:last-child{border-right:0}
.customer strong{font-size:11px}
.customer div{font-size:9px;line-height:1.45;margin-top:2px}
.items{width:100%;border-collapse:collapse;font-size:9px}
.items th,.items td{border-right:1px solid #222;border-bottom:1px solid #222;padding:6px 4px;vertical-align:middle}
.items th:last-child,.items td:last-child{border-right:0}
.items th{font-size:8px;background:#f3f4f6;text-transform:uppercase}
.items td.num,.items th.num{text-align:right}
.items td.center,.items th.center{text-align:center}
.items .product{font-weight:700}
.summary-grid{display:grid;grid-template-columns:1fr 330px;border-top:0}
.tax-table{border-right:1px solid #222}
.tax-table table{width:100%;border-collapse:collapse;font-size:8px}
.tax-table th,.tax-table td{border-right:1px solid #222;border-bottom:1px solid #222;padding:5px 4px;text-align:right}
.tax-table th:first-child,.tax-table td:first-child{text-align:center}
.tax-table th{background:#f3f4f6}
.totals{padding:8px}
.total-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0}
.total-row.grand{border-top:2px solid #222;margin-top:4px;padding-top:7px;font-size:13px;font-weight:800}
.amount-words{font-size:9px;padding:8px;border-top:1px solid #222}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #222;border-top:0;min-height:105px}
.bottom-box{padding:8px;border-right:1px solid #222}
.bottom-box:last-child{border-right:0}
.bottom-box h4{font-size:9px;margin-bottom:8px}
.bottom-box p{font-size:8px;line-height:1.5;color:#333}
.sign{margin-top:40px;border-top:1px solid #555;text-align:center;padding-top:4px;font-size:8px}
.footer{text-align:center;padding:10px 0 0;font-size:8px;color:#555}
.actions{width:min(100%,980px);margin:14px auto 0;display:flex;gap:10px;position:sticky;bottom:0;padding:12px 0;z-index:5;background:linear-gradient(to top,#111 70%,transparent)}
.actions button{flex:1;border:0;border-radius:12px;padding:14px 10px;font-size:14px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;letter-spacing:.2px}
.actions button:active{transform:scale(.97)}
.actions button:disabled{opacity:.7;cursor:wait}
.print{background:linear-gradient(135deg,#e02020,#b81414);color:#fff;box-shadow:0 8px 20px rgba(224,32,32,.35);flex:1.6!important}.back{background:#2b2b2b;color:#fff}
.vstrip{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;padding:7px 10px;border-radius:8px;background:linear-gradient(135deg,#eafaf1,#d8f3e4);border:1px solid #a9dfc2;color:#0a6b35;font-size:10px;font-weight:800;letter-spacing:.3px}
.vstrip i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#0a9a4a;color:#fff;font-size:10px}
.vseal{margin:4px auto 0;width:118px;border:2px solid #0a9a4a;border-radius:10px;padding:5px 4px;text-align:center;color:#0a7d3b;transform:rotate(-6deg);background:#f4fcf7}
.vseal b{display:block;font-size:10px;letter-spacing:.8px}.vseal span{display:block;font-size:7px;line-height:1.4;color:#2f6b4a}
.vseal em{display:block;font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:.5px;margin-top:2px}
.vstrip.pending{background:linear-gradient(135deg,#fff8e8,#fdf0cf);border-color:#ecd28a;color:#8a5a00}
.vstrip.pending i{background:#d99a00}
.vseal.pending{border:2px dashed #aaa;color:#777;background:#fafafa}
.vseal.pending span{color:#888}
.sigimg{display:block;margin:4px auto -6px;max-width:150px;max-height:48px}
.vpanel{width:min(100%,980px);margin:14px auto 0;background:#fff;border-radius:14px;padding:16px 18px;color:#111;box-shadow:0 8px 30px #0006}
.vpanel h3{font-size:15px;margin-bottom:4px}
.vpanel p{font-size:12px;color:#555;line-height:1.5;margin-bottom:12px}
.vpanel .vbtns{display:flex;gap:10px;flex-wrap:wrap}
.vpanel button{border:0;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:800;cursor:pointer;flex:1;min-width:140px}
.vpanel .vgo{background:linear-gradient(135deg,#0a9a4a,#077a39);color:#fff}
.vpanel .vsg{background:#2b2b2b;color:#fff}
.vpanel .vlt{background:#eee;color:#222}
.vpanel button:disabled{opacity:.6;cursor:wait}
.vpad{margin-top:12px;display:none}
.vpad canvas{width:100%;height:170px;border:2px dashed #999;border-radius:10px;background:#fff;touch-action:none;display:block}
.vpad .vbtns{margin-top:8px}
.loading{text-align:center;padding:80px;color:#fff}
.error{text-align:center;padding:80px;color:#e02020;background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:10px;line-height:1.45}
.kv .k{color:#555}
.note{font-size:9px;color:#444;padding:8px;line-height:1.5}
.pill{display:inline-block;padding:1px 6px;border-radius:10px;background:#f3f4f6;font-size:9px;font-weight:700}
.save{color:#0a7d3b;font-weight:700}
@media(max-width:700px){
 body{padding:0;background:#fff}
 .invoice-wrap{box-shadow:none;width:100%}
 .invoice{padding:10px}
 .top-grid{grid-template-columns:1fr}
 .box{border-right:0;border-bottom:1px solid #222;min-height:auto}
 .box:last-child{border-bottom:0}
 .summary-grid{grid-template-columns:1fr}
 .tax-table{border-right:0;border-bottom:1px solid #222}
 .bottom-grid{grid-template-columns:1fr}
 .bottom-box{border-right:0;border-bottom:1px solid #222;min-height:80px}
 .bottom-box:last-child{border-bottom:0}
 .customer-grid{grid-template-columns:1fr}
 .customer{border-right:0;border-bottom:1px solid #222}
 .customer:last-child{border-bottom:0}
 .items{font-size:8px;min-width:760px}
 .items-wrap{overflow-x:auto}
 .actions{padding:0 10px 10px}
}
@media(max-width:700px){.actions{padding:10px;background:linear-gradient(to top,#fff 70%,transparent)}.actions .back{display:none}.actions .back:first-child{display:block;flex:.6}}
@media print{
 .vpanel{display:none!important}
 body{padding:0;background:#fff}
 .invoice-wrap{width:100%;box-shadow:none}
 .actions{display:none!important}
 @page{size:A4;margin:8mm}
}
</style>
</head>
<body>

<div id="app"><div class="loading">Loading receipt…</div></div>

<div class="actions">
<button class="back" onclick="history.back()">← Back</button>
<button class="print" id="dlBtn" onclick="downloadPdf()">⬇ Download PDF</button>
<button class="back" onclick="shareInvoice()">↗ Share</button>
<button class="back" onclick="window.print()">🖨 Print</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
<script src="supabase-constants.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const params=new URLSearchParams(location.search);
const type=(params.get('type')||'order').toLowerCase();
const orderId=params.get('order_id')||(type==='order'?params.get('id')||params.get('ref'):null);
const bookingId=params.get('id')||params.get('ref');
const verified=params.get('v')==='1';
const merchantIdParam=params.get('merchant_id');
const ROLE={order:'Merchant',nurse:'Nurse',ambulance:'Ambulance Driver'};
let VS=null;

let db=null;
try{
 if(window.supabase?.createClient && typeof SUPABASE_URL!=='undefined' && typeof SUPABASE_KEY!=='undefined'){
   db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 }
}catch(e){}

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>'₹'+Number(v||0).toFixed(2);
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const date=v=>v?new Date(v).toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const time=v=>v?new Date(v).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
const pick=(...a)=>{for(const x of a){if(x!==undefined&&x!==null&&String(x).trim()!=='')return x}return ''};
const has=v=>v!==undefined&&v!==null&&String(v).trim()!=='';
const err=m=>{document.getElementById('app').innerHTML='<div class="error">'+m+'</div>'};
const cap=s=>String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

async function load(){
 if(!db){err('Supabase is not configured. Check supabase-constants.js.');return;}
 try{
   if(type==='nurse') return await loadNurse();
   if(type==='lab') return await loadLab();
   if(type==='ambulance') return await loadAmbulance();
   return await loadOrder();
 }catch(e){console.error(e);err('Unable to load this receipt. Please try again.');}
}

/* ================= MEDICINE ORDER ================= */
async function getInvoice(t,ref){
 const r=await db.rpc('get_invoice',{p_type:t,p_ref:String(ref)});
 if(r.error){console.error(r.error);return null;}
 return r.data||null;
}
async function loadOrder(){
 if(!orderId){err('Missing order ID. Use ?order_id=ORD-XXXX');return;}
 const inv=await getInvoice('order',orderId);
 if(!inv||!inv.order){err('Order not found: '+esc(orderId));return;}
 const order=inv.order;
 order.order_items=inv.items||[];
 // Fallback: old orders whose lines were never saved → rebuild from the order's own item text
 if(!order.order_items.length&&order.items_text){
   order.order_items=String(order.items_text).split(',').map(x=>x.trim()).filter(Boolean).map(x=>{
     const mm=x.match(/^(.*?)\s*[×x]\s*(\d+)$/);
     return {product_name:mm?mm[1].trim():x,quantity:mm?Number(mm[2]):1,unit_price:0,total_price:0};
   });
 }
 const meds={};
 (inv.medicines||[]).forEach(m=>{meds['id:'+m.id]=m;meds['nm:'+m.product_name]=m;});
 order.order_items.forEach(i=>{i._med=meds['id:'+i.medicine_id]||meds['nm:'+i.product_name]||null;});
 renderOrder(order,inv.merchant||null);
}

function renderOrder(o,m){
 const items=o.order_items||[];
 const rows=items.map(i=>{
   const med=i._med||{};
   const qty=Number(i.quantity||1), unit=num(pick(i.unit_price,i.price)), line=num(pick(i.total_price,unit*qty));
   const mrp=num(pick(i.mrp,med.mrp,unit));
   const gstRaw=pick(i.gst_rate,med.gst_rate);
   const gst=has(gstRaw)?Number(gstRaw):null;
   return {
     name:pick(i.product_name,i.name,med.product_name,med.name,'Item'),
     sub:pick(med.composition,med.strength),
     mfr:pick(i.manufacturer,med.manufacturer,med.brand_name),
     batch:pick(i.batch_number,med.batch_number,med.lot_number),
     expiry:pick(i.expiry_date,med.expiry_date),
     hsn:pick(i.hsn_code,med.hsn_code),
     qty,unit,line,mrp,gst
   };
 });
 const subtotal=rows.reduce((s,r)=>s+r.line,0);
 const mrpTotal=rows.reduce((s,r)=>s+Math.max(r.mrp,r.unit)*r.qty,0);
 const savings=Math.max(0,mrpTotal-subtotal);
 const total=num(pick(o.total_amount,o.final_amount,o.total_bill,o.total,subtotal));
 const f=k=>num(o[k]);
 const shipping=f('shipping_fee'),delivery=f('delivery_fee'),platform=f('platform_fee'),processing=f('processing_fee'),speed=f('delivery_speed_fee'),cod=f('cod_fee'),discount=f('discount');
 const invoiceNo='INV-'+String(o.order_id||o.id||'').replace(/^ORD-/,'');
 const payment=String(pick(o.payment_mode,o.payment_method,'COD')).replace(/_/g,' ').toUpperCase();
 const status=String(pick(o.status,'Pending')).toUpperCase();
 const payStatus=pick(o.payment_status);
 const customer=pick(o.customer_name,o.user_name,'Customer');
 const phone=pick(o.customer_phone,o.user_phone);
 const address=pick(o.delivery_address,o.customer_address,o.address);
 const shopName=pick(m?.shop_name,m?.merchant_name,o.pharmacy_name,'Partner Pharmacy');
 const soldBy=[pick(m?.resolved_address,m?.address),m?.city,m?.state,m?.pincode].filter(has).join(', ');
 const created=pick(o.created_at,new Date().toISOString());

 // GST: item prices are MRP-inclusive → back out tax per rate (CGST+SGST split, intra-state)
 const groups={};
 rows.forEach(r=>{
   const k=r.gst===null?'na':String(r.gst);
   const g=groups[k]=groups[k]||{rate:r.gst,gross:0};
   g.gross+=r.line;
 });
 const gstKeys=Object.keys(groups).sort((a,b)=>(a==='na')-(b==='na')||Number(a)-Number(b));
 let totalTax=0;
 const taxRows=gstKeys.map(k=>{
   const g=groups[k];
   if(g.rate===null)return `<tr><td>N/A</td><td>${money(g.gross)}</td><td>—</td><td>—</td><td>—</td></tr>`;
   const taxable=g.gross/(1+g.rate/100), tax=g.gross-taxable; totalTax+=tax;
   return `<tr><td>${g.rate}</td><td>${money(taxable)}</td><td>${money(tax/2)}</td><td>${money(tax/2)}</td><td>0.00</td></tr>`;
 }).join('');
 const allRated=rows.length>0&&rows.every(r=>r.gst!==null);
 const gstin=pick(m?.gstin);
 const docTitle=(allRated&&gstin)?'Tax Invoice (Original for Recipient)':'Invoice / Cash Memo (Original for Recipient)';

 const itemRows=rows.length?rows.map((r,n)=>`<tr>
   <td class="center">${n+1}</td>
   <td><div class="product">${esc(r.name)}</div>${r.sub?'<div>'+esc(r.sub)+'</div>':''}</td>
   <td>${esc(r.mfr||'—')}</td>
   <td>${esc(r.batch||'—')}</td>
   <td class="center">${esc(r.expiry?date(r.expiry):'—')}</td>
   <td class="center">${esc(r.hsn||'—')}</td>
   <td class="center">${r.qty}</td>
   <td class="num">${r.mrp>r.unit?'<s>'+money(r.mrp)+'</s><br>':''}${money(r.unit)}</td>
   <td class="num">${r.gst===null?'—':r.gst+'%'}</td>
   <td class="num">${money(r.line)}</td></tr>`).join(''):'<tr><td colspan="10" class="center">No item details available</td></tr>';

 const sellerKv=[
   ['Owner',m?.owner_name],['Phone',m?.phone],['GSTIN',gstin||'Not provided'],['Drug Licence',m?.license_id]
 ].filter(x=>x[0]==='GSTIN'||has(x[1])).map(x=>`<span class="k">${x[0]}</span><span>${esc(x[1])}</span>`).join('');

 shell({
   docTitle,
   leftHead:'Sold By',
   leftHtml:`<p><b>${esc(shopName)}</b><br>${esc(soldBy||'Partner pharmacy address not available')}</p><div class="kv" style="margin-top:4px">${sellerKv}</div>`,
   midHead:'Sold To',
   midHtml:`<p><b>${esc(customer)}</b><br>${phone?'Phone: '+esc(phone)+'<br>':''}${esc(address)}</p>
     <div class="invoice-meta">
       <div><span class="label">Payment:</span> <span class="value">${esc(payment)}</span></div>
       <div><span class="label">Status:</span> <span class="value">${esc(status)}</span></div>
       ${payStatus?`<div><span class="label">Pay Status:</span> <span class="value">${esc(payStatus)}</span></div>`:''}
       ${o.payment_utr?`<div><span class="label">UTR:</span> <span class="value">${esc(o.payment_utr)}</span></div>`:''}
     </div>`,
   invoiceNo,orderRef:o.order_id||o.id,created,
   qrQuery:'type=order&ref='+encodeURIComponent(o.id||o.order_id||''),
   itemsTitle:'Order Items',
   itemsHtml:`<table class="items"><thead><tr><th style="width:28px">Sr.</th><th>Product Name</th><th>MFR. Name</th><th>Batch No.</th><th class="center">Expiry</th><th class="center">HSN</th><th class="center">Qty</th><th class="num">MRP / Price</th><th class="num">GST</th><th class="num">Total</th></tr></thead><tbody>${itemRows}</tbody></table>`,
   leftSummary:`<table><thead><tr><th>GST %</th><th>Taxable Amount</th><th>CGST</th><th>SGST</th><th>IGST</th></tr></thead><tbody>${taxRows||'<tr><td colspan="5">—</td></tr>'}</tbody></table>
     <div class="note">${allRated?'Prices are inclusive of GST. Tax shown is the GST contained in the item prices.':'GST rate not recorded by the seller for some items — tax shown only for items with a recorded rate.'}${o.prescription_required?'<br><b>Prescription:</b> '+(o.prescription_verified||o.rx_verified?'verified':'uploaded for this order')+'.':''}</div>`,
   totalsHtml:`
     <div class="total-row"><span>Items Total</span><b>${money(subtotal)}</b></div>
     ${shipping?`<div class="total-row"><span>Shipping &amp; Handling</span><b>${money(shipping)}</b></div>`:''}
     ${delivery?`<div class="total-row"><span>Delivery Charges</span><b>${money(delivery)}</b></div>`:''}
     ${platform?`<div class="total-row"><span>Platform Fee</span><b>${money(platform)}</b></div>`:''}
     ${processing?`<div class="total-row"><span>Processing Charge</span><b>${money(processing)}</b></div>`:''}
     ${speed?`<div class="total-row"><span>Fast Delivery Fee</span><b>${money(speed)}</b></div>`:''}
     ${cod?`<div class="total-row"><span>COD Handling Fee</span><b>${money(cod)}</b></div>`:''}
     ${discount?`<div class="total-row"><span>Discount${o.coupon_code?' ('+esc(o.coupon_code)+')':''}</span><b>-${money(discount)}</b></div>`:''}
     ${totalTax>0?`<div class="total-row"><span>GST included in items</span><b>${money(totalTax)}</b></div>`:''}
     ${savings>0?`<div class="total-row save"><span>You saved vs MRP</span><b>${money(savings)}</b></div>`:''}
     <div class="total-row grand"><span>PAYABLE AMOUNT</span><span>${money(total)}</span></div>`,
   total,
   bottom1:`Payment Mode: <b>${esc(payment)}</b><br>Order Status: <b>${esc(status)}</b>${o.delivery_speed?('<br>Delivery Type: '+esc(cap(o.delivery_speed==='manual'?'Standard':o.delivery_speed))):''}${o.courier_name?'<br>Courier: '+esc(o.courier_name):''}${o.courier_tracking?'<br>Tracking: '+esc(o.courier_tracking):''}`,
   bottom2:'Sold by the pharmacy named above; MediFinder India acts as the marketplace platform. Medicines once delivered are returnable only as per the return policy. For support, use the Help Desk in the MediFinder India app.',
   signFor:'For '+esc(shopName)
 });
}

/* ================= NURSE ================= */
async function loadNurse(){
 if(!bookingId){err('Missing booking ID.');return;}
 const inv=await getInvoice('nurse',bookingId);
 if(!inv||!inv.booking){err('Nurse booking not found.');return;}
 const b=inv.booking;
 const addr=[b.addr_house,b.addr_street,b.addr_landmark&&('Near '+b.addr_landmark),b.addr_city,b.addr_state,b.addr_pincode].filter(has).join(', ');
 const subtotal=num(b.subtotal), svc=num(b.service_charge), total=num(pick(b.total_amount,subtotal+svc));
 const pay=String(pick(b.payment_method,'—')).toUpperCase();
 const ref='NRS-'+String(b.id).slice(0,8).toUpperCase();
 renderService({
   docTitle:'Service Invoice — Home Nurse Booking',
   leftHead:'Service Provided By',
   leftHtml:`<p><b>${esc(pick(b.nurse_name,'Nurse to be assigned'))}</b>${b.nurse_qualification?'<br>'+esc(b.nurse_qualification):''}${b.nurse_contact?'<br>Phone: '+esc(b.nurse_contact):''}</p><p style="margin-top:4px">Booked via <b>MediFinder India</b></p>`,
   midHead:'Patient / Booked By',
   midHtml:`<p><b>${esc(pick(b.patient_name,'Patient'))}</b>${b.patient_age?' ('+esc(b.patient_age)+' yrs'+(b.gender?', '+esc(b.gender):'')+')':''}<br>${b.contact_no?'Phone: '+esc(b.contact_no)+'<br>':''}${esc(addr)}</p>

function verifyId(c){
 const str=[c.invoiceNo,c.orderRef,Number(c.total||0).toFixed(2),c.created||''].join('|');
 let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
 return 'MFV-'+h.toString(36).toUpperCase().padStart(7,'0').slice(0,7);
}

/* ================= VERIFICATION (only the provider can verify) ================= */
const $=id=>document.getElementById(id);
async function loadVerification(){
 VS=null;
 if(!db||!ROLE[type]||!window.__vref||!$('vstrip'))return;
 try{
   const r=await db.rpc('get_invoice_signoff',{p_type:type,p_ref:String(window.__vref)});
   if(r.error)throw r.error;
   const d=r.data||{},so=d.signoff||null;
   VS={verified:!!so,method:so&&so.mode==='signature'?'signature':'verify',signature:so?so.signature_data:null,
       signer_role:so?so.signer_role:(d.role||null),signer_name:so?so.signer_name:null,verified_at:so?so.signed_at:null,can_verify:!!d.can_sign};
 }catch(e){console.warn('Verification status unavailable',e);}
 paintVerification();
 renderVerifyPanel();
}
function paintVerification(){
 const strip=$('vstrip'),txt=$('vtext'),seal=$('vseal'),sig=$('sigimg');
 if(!strip||!ROLE[type])return;
 const vid=window.__vid, scan=verified?' · OPENED VIA QR':'';
 if(VS&&VS.verified){
   const role=VS.signer_role||ROLE[type];
   const who=role+(VS.signer_name?' — '+VS.signer_name:'');
   const signed=VS.method==='signature';
   strip.className='vstrip';strip.querySelector('i').textContent='✔';
   txt.textContent='e-VERIFIED INVOICE · ID '+vid+' · '+(signed?'SIGNED':'VERIFIED')+' BY '+who.toUpperCase()+' · '+date(VS.verified_at)+scan;
   if(seal){
     seal.className='vseal';
     seal.innerHTML='<b>✔ '+(signed?'SIGNED &amp; VERIFIED':'e-VERIFIED')+'</b><span>By '+esc(who)+'<br>'+esc(date(VS.verified_at))+' '+esc(time(VS.verified_at))+'</span><em>'+esc(vid)+'</em>';
   }
   if(sig&&signed&&/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(VS.signature||'')){sig.src=VS.signature;sig.style.display='block';}
 }else{
   strip.className='vstrip pending';strip.querySelector('i').textContent='!';
   txt.textContent='AWAITING VERIFICATION BY '+ROLE[type].toUpperCase()+' · ID '+vid+scan;
 }
}
function renderVerifyPanel(){
 const old=$('vpanel');if(old)old.remove();
 if(!VS||VS.verified||!VS.can_verify)return;
 const role=ROLE[type];
 const p=document.createElement('div');p.id='vpanel';p.className='vpanel';
 p.innerHTML=`<h3>You are the ${esc(role)} on this invoice</h3>
   <p>Only you can verify it. Tap <b>Verify invoice</b> to stamp the e-verified mark, or <b>Sign manually</b> to draw your signature.</p>
   <div class="vbtns"><button class="vgo" id="vGo">✔ Verify invoice</button><button class="vsg" id="vSg">✍ Sign manually</button></div>
   <div class="vpad" id="vPad"><canvas id="vCan" width="900" height="260"></canvas>
     <div class="vbtns"><button class="vlt" id="vClr">Clear</button><button class="vgo" id="vSave">✔ Save signature &amp; verify</button></div></div>`;
 document.querySelector('.invoice-wrap').after(p);
 $('vGo').onclick=()=>submitVerify('verify',null);
 $('vSg').onclick=()=>{$('vPad').style.display='block';$('vSg').style.display='none';setupPad();};
}
function setupPad(){
 const cv=$('vCan'),ctx=cv.getContext('2d');let drawing=false,drawn=false;
 ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
 const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
 cv.onpointerdown=e=>{e.preventDefault();drawing=true;cv.setPointerCapture(e.pointerId);const q=pos(e);ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x+.1,q.y+.1);ctx.stroke();drawn=true};
 cv.onpointermove=e=>{if(!drawing)return;e.preventDefault();const q=pos(e);ctx.lineTo(q.x,q.y);ctx.stroke()};
 const end=()=>{drawing=false};cv.onpointerup=end;cv.onpointercancel=end;
 $('vClr').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);drawn=false};
 $('vSave').onclick=()=>{
   if(!drawn){alert('Please draw your signature first.');return}
   submitVerify('signature',cv.toDataURL('image/png'));
 };
}
async function submitVerify(method,signature){
 const btns=[...document.querySelectorAll('#vpanel button')];
 btns.forEach(b=>b.disabled=true);
 try{
   const r=await db.rpc('sign_invoice',{p_type:type,p_ref:String(window.__vref),p_mode:method==='signature'?'signature':'verified',p_signature:signature});
   if(r.error)throw r.error;
   await loadVerification();
 }catch(e){
   console.error(e);
   alert('Could not verify: '+(e&&e.message?e.message:'please try again.'));
   btns.forEach(b=>b.disabled=false);
 }
}

}
function amountWords(n){
 const v=Number(n||0), rupees=Math.floor(v), paise=Math.round((v-rupees)*100);
 if(rupees===0&&paise===0)return'Zero only';
 const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');
 const three=x=>x<100?two(x):ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):'');
 let x=rupees,s='';
 if(x>=10000000){s+=three(Math.floor(x/10000000))+' Crore ';x%=10000000}
 if(x>=100000){s+=three(Math.floor(x/100000))+' Lakh ';x%=100000}
 if(x>=1000){s+=three(Math.floor(x/1000))+' Thousand ';x%=1000}
 if(x)s+=three(x);
 let out='Rupees '+(s.trim()||'Zero');
 if(paise)out+=' and '+two(paise)+' Paise';
 return (out+' only').replace(/\s+/g,' ');
}
async function downloadPdf(){
 const btn=document.getElementById('dlBtn'), el=document.querySelector('.invoice-wrap');
 if(!el)return;
 const old=btn.textContent; btn.disabled=true; btn.textContent='Preparing PDF…';
 try{
   if(!window.html2canvas||!window.jspdf)throw new Error('pdf libs missing');
   const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:980});
   const {jsPDF}=window.jspdf, pdf=new jsPDF('p','mm','a4');
   const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), m=6;
   const w=pw-m*2, h=canvas.height*w/canvas.width, pageH=ph-m*2;
   const img=canvas.toDataURL('image/jpeg',0.92);
   let y=0,first=true;
   while(y<h-0.5){ if(!first)pdf.addPage(); pdf.addImage(img,'JPEG',m,m-y,w,h); first=false; y+=pageH;
     if(y<h-0.5){ pdf.setFillColor(255,255,255); } }
   pdf.save(window.__invoiceName||'MediFinder-Invoice.pdf');
 }catch(e){ console.error(e); alert('Could not create PDF directly — opening print dialog, choose "Save as PDF".'); window.print(); }
 btn.disabled=false; btn.textContent=old;
}
load().then(async()=>{ await loadVerification(); if(params.get('download')==='1' && document.querySelector('.invoice-wrap')) setTimeout(downloadPdf,900); });
