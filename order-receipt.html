<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax Invoice | MediFinder India</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#111;padding:24px}
.invoice-wrap{width:min(100%,980px);margin:auto;background:#fff;box-shadow:0 8px 40px #0008}
.invoice{padding:20px 24px 24px}
.top-title{text-align:center;font-size:12px;font-weight:700;margin-bottom:10px}
.top-grid{display:grid;grid-template-columns:1.15fr 1.15fr .75fr;border:1px solid #222}
.box{padding:8px;border-right:1px solid #222;min-height:150px}
.box:last-child{border-right:0}
.box h3{font-size:11px;text-transform:uppercase;margin-bottom:5px}
.box p{font-size:10px;line-height:1.45}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.brand img{width:42px;height:42px;object-fit:contain}
.brand b{font-size:16px;color:#e02020}
.brand small{display:block;color:#555;font-size:8px}
.invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:6px}
.invoice-meta div{font-size:10px}
.label{color:#555}
.value{font-weight:700}
.qr{width:105px;height:105px;display:block;margin:5px auto 3px;border:1px solid #ddd;padding:3px}
.qr-note{text-align:center;font-size:8px;color:#555}
.section{border:1px solid #222;border-top:0}
.section-title{background:#f3f4f6;border-bottom:1px solid #222;padding:6px 8px;font-size:10px;font-weight:700;text-transform:uppercase}
.customer-grid{display:grid;grid-template-columns:1fr 1fr}
.customer{padding:8px;border-right:1px solid #222;min-height:82px}
.customer:last-child{border-right:0}
.customer strong{font-size:11px}
.customer div{font-size:9px;line-height:1.45;margin-top:2px}
.items{width:100%;border-collapse:collapse;font-size:9px}
.items th,.items td{border-right:1px solid #222;border-bottom:1px solid #222;padding:6px 4px;vertical-align:middle}
.items th:last-child,.items td:last-child{border-right:0}
.items th{font-size:8px;background:#f3f4f6;text-transform:uppercase}
.items td.num,.items th.num{text-align:right}
.items td.center,.items th.center{text-align:center}
.items .product{font-weight:700}
.summary-grid{display:grid;grid-template-columns:1fr 330px;border-top:0}
.tax-table{border-right:1px solid #222}
.tax-table table{width:100%;border-collapse:collapse;font-size:8px}
.tax-table th,.tax-table td{border-right:1px solid #222;border-bottom:1px solid #222;padding:5px 4px;text-align:right}
.tax-table th:first-child,.tax-table td:first-child{text-align:center}
.tax-table th{background:#f3f4f6}
.totals{padding:8px}
.total-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0}
.total-row.grand{border-top:2px solid #222;margin-top:4px;padding-top:7px;font-size:13px;font-weight:800}
.amount-words{font-size:9px;padding:8px;border-top:1px solid #222}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #222;border-top:0;min-height:105px}
.bottom-box{padding:8px;border-right:1px solid #222}
.bottom-box:last-child{border-right:0}
.bottom-box h4{font-size:9px;margin-bottom:8px}
.bottom-box p{font-size:8px;line-height:1.5;color:#333}
.sign{margin-top:40px;border-top:1px solid #555;text-align:center;padding-top:4px;font-size:8px}
.footer{text-align:center;padding:10px 0 0;font-size:8px;color:#555}
.actions{width:min(100%,980px);margin:14px auto 0;display:flex;gap:10px}
.actions button{flex:1;border:0;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.print{background:#e02020;color:#fff}.back{background:#333;color:#fff}
.loading{text-align:center;padding:80px;color:#fff}
.error{text-align:center;padding:80px;color:#e02020;background:#fff}
@media(max-width:700px){
 body{padding:0;background:#fff}
 .invoice-wrap{box-shadow:none;width:100%}
 .invoice{padding:10px}
 .top-grid{grid-template-columns:1fr}
 .box{border-right:0;border-bottom:1px solid #222;min-height:auto}
 .box:last-child{border-bottom:0}
 .summary-grid{grid-template-columns:1fr}
 .tax-table{border-right:0;border-bottom:1px solid #222}
 .bottom-grid{grid-template-columns:1fr}
 .bottom-box{border-right:0;border-bottom:1px solid #222;min-height:80px}
 .bottom-box:last-child{border-bottom:0}
 .customer-grid{grid-template-columns:1fr}
 .customer{border-right:0;border-bottom:1px solid #222}
 .customer:last-child{border-bottom:0}
 .items{font-size:8px;min-width:760px}
 .items-wrap{overflow-x:auto}
 .actions{padding:0 10px 10px}
}
@media print{
 body{padding:0;background:#fff}
 .invoice-wrap{width:100%;box-shadow:none}
 .actions{display:none!important}
 @page{size:A4;margin:8mm}
}
</style>
</head>
<body>

<div id="app"><div class="loading">Loading receipt…</div></div>

<div class="actions">
<button class="back" onclick="history.back()">← Back</button>
<button class="print" onclick="window.print()">🖨 Print / Save PDF</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
<script src="supabase-constants.js"></script>

<script>
const params=new URLSearchParams(location.search);
const orderId=params.get('order_id');
const merchantIdParam=params.get('merchant_id');

let db=null;
try{
 if(window.supabase?.createClient && typeof SUPABASE_URL!=='undefined' && typeof SUPABASE_KEY!=='undefined'){
   db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 }
}catch(e){}

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>'₹'+Number(v||0).toFixed(2);
const date=v=>v?new Date(v).toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const time=v=>v?new Date(v).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';

async function load(){
 const app=document.getElementById('app');
 if(!orderId){app.innerHTML='<div class="error">Missing order ID. Use ?order_id=ORD-XXXX</div>';return;}
 if(!db){app.innerHTML='<div class="error">Supabase is not configured. Check supabase-constants.js.</div>';return;}
 try{
   const {data:order,error}=await db.from('orders').select('*').eq('order_id',orderId).single();
   if(error||!order){app.innerHTML='<div class="error">Order not found: '+esc(orderId)+'</div>';return;}

   const {data:items}=await db.from('order_items').select('*').eq('order_id',orderId);
   order.order_items=items||[];

   let merchant=null;
   const mid=merchantIdParam||order.merchant_id||(order.order_items[0]?.merchant_id);
   if(mid){
     const r=await db.from('merchants').select('*').eq('id',mid).single();
     merchant=r.data||null;
   }
   render(order,merchant);
 }catch(e){
   console.error(e);
   app.innerHTML='<div class="error">Unable to load this receipt. Please try again.</div>';
 }
}

function render(o,m){
 const items=o.order_items||[];
 const subtotal=items.reduce((s,i)=>s+Number(i.total_price ?? (Number(i.unit_price||0)*Number(i.quantity||1))),0);
 const total=Number(o.total_amount ?? o.total ?? subtotal);
 const shipping=Number(o.shipping_fee||0);
 const delivery=Number(o.delivery_fee||0);
 const platform=Number(o.platform_fee||0);
 const processing=Number(o.processing_fee||0);
 const speed=Number(o.delivery_speed_fee||0);
 const cod=Number(o.cod_fee||0);
 const tax=Number(o.tax||0);
 const discount=Number(o.discount||0);
 const invoiceNo='INV-'+String(o.order_id||o.id||'').replace(/^ORD-/,'');
 const payment=(o.payment_method||o.payment_mode||'COD').toUpperCase();
 const status=(o.status||'Pending').toUpperCase();
 const customer=o.customer_name||o.user_name||'Customer';
 const phone=o.customer_phone||o.user_phone||'';
 const address=o.delivery_address||o.customer_address||o.address||'';
 const shopName=m?.shop_name||m?.merchant_name||'MediFinder India Partner Store';
 const shopPhone=m?.phone||'';
 const shopAddress=m?.resolved_address||m?.address||'';
 const shopCity=m?.city||'';
 const shopPin=m?.pincode||'';
 const soldBy=[shopAddress,shopCity,shopPin].filter(Boolean).join(', ');
 const created=o.created_at||new Date().toISOString();
 const qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(location.origin+location.pathname+'?order_id='+encodeURIComponent(o.order_id||o.id||''));
 const rows=items.length?items.map((i,n)=>{
   const qty=Number(i.quantity||1), unit=Number(i.unit_price||0), line=Number(i.total_price ?? unit*qty);
   const gst=Number(i.gst_rate||i.tax_rate||0);
   const hsn=i.hsn_code||i.hsn||'—';
   return `<tr>
     <td class="center">${n+1}</td>
     <td><div class="product">${esc(i.product_name||i.medicine_name||i.product_category||i.dosage_form||'Medicine')}</div>${i.description?'<div>'+esc(i.description)+'</div>':''}</td>
     <td>${esc(i.manufacturer||i.mfr_name||'—')}</td>
     <td>${esc(i.batch_no||i.batch||'—')}</td>
     <td class="center">${esc(i.expiry_date||i.expiry||'—')}</td>
     <td class="center">${qty}</td>
     <td class="num">${money(unit)}</td>
     <td class="num">${gst}%</td>
     <td class="num">${money(line)}</td>
   </tr>`;
 }).join('') : `<tr><td colspan="9" class="center">No item details available</td></tr>`;

 document.getElementById('app').innerHTML=`
 <div class="invoice-wrap">
 <div class="invoice">
   <div class="top-title">Tax Invoice / Bill of Supply / Cash Memo &nbsp; (Original for Recipient)</div>

   <div class="top-grid">
     <div class="box">
       <div class="brand"><img src="favicon.png" onerror="this.style.display='none'"><div><b>MEDIFINDER INDIA</b><small>Healthcare & Medicine Delivery Platform</small></div></div>
       <h3>Sold By</h3>
       <p><b>${esc(shopName)}</b><br>${esc(soldBy||'Partner pharmacy address not available')}<br>${shopPhone?'Phone: '+esc(shopPhone):''}</p>
     </div>

     <div class="box">
       <h3>Sold To</h3>
       <p><b>${esc(customer)}</b><br>${phone?'Phone: '+esc(phone)+'<br>':''}${esc(address)}</p>
       <div class="invoice-meta">
         <div><span class="label">Payment:</span> <span class="value">${esc(payment)}</span></div>
         <div><span class="label">Status:</span> <span class="value">${esc(status)}</span></div>
       </div>
     </div>

     <div class="box">
       <h3>Invoice Details</h3>
       <p><b>Invoice No.</b><br>${esc(invoiceNo)}</p>
       <div class="invoice-meta">
         <div><span class="label">Date</span><br><span class="value">${date(created)}</span></div>
         <div><span class="label">Time</span><br><span class="value">${time(created)}</span></div>
       </div>
       <p style="margin-top:5px"><b>Order ID</b><br>${esc(o.order_id||o.id||'—')}</p>
       <img class="qr" src="${qr}" alt="Order QR">
       <div class="qr-note">For Internal / Verification Purpose</div>
     </div>
   </div>

   <div class="section">
     <div class="section-title">Order Items</div>
     <div class="items-wrap">
     <table class="items">
       <thead><tr>
         <th style="width:32px">Sr.</th><th>Product Name</th><th>MFR. Name</th><th>Batch No.</th><th>Expiry</th><th class="center">Qty</th><th class="num">MRP/Price</th><th class="num">GST</th><th class="num">Total</th>
       </tr></thead>
       <tbody>${rows}</tbody>
     </table>
     </div>
   </div>

   <div class="section summary-grid">
     <div class="tax-table">
       <table>
        <thead><tr><th>GST %</th><th>Taxable Amount</th><th>CGST</th><th>SGST</th><th>IGST</th></tr></thead>
        <tbody>
          <tr><td>0</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td></tr>
          <tr><td>5</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td></tr>
          <tr><td>12</td><td>${money(tax?subtotal:0)}</td><td>0.00</td><td>0.00</td><td>${money(tax)}</td></tr>
          <tr><td>18</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td></tr>
        </tbody>
       </table>
     </div>
     <div class="totals">
       <div class="total-row"><span>Gross Amount</span><b>${money(subtotal)}</b></div>
       ${shipping?`<div class="total-row"><span>Shipping &amp; Handling</span><b>${money(shipping)}</b></div>`:''}
       ${delivery?`<div class="total-row"><span>Delivery Charges</span><b>${money(delivery)}</b></div>`:''}
       ${platform?`<div class="total-row"><span>Platform Fee</span><b>${money(platform)}</b></div>`:''}
       ${processing?`<div class="total-row"><span>Processing Charge</span><b>${money(processing)}</b></div>`:''}
       ${speed?`<div class="total-row"><span>Fast Delivery Fee</span><b>${money(speed)}</b></div>`:''}
       ${cod?`<div class="total-row"><span>COD Handling Fee</span><b>${money(cod)}</b></div>`:''}
       ${tax?`<div class="total-row"><span>Tax / GST</span><b>${money(tax)}</b></div>`:''}
       ${discount?`<div class="total-row"><span>Discount</span><b>-${money(discount)}</b></div>`:''}
       <div class="total-row grand"><span>PAYABLE AMOUNT</span><span>${money(total)}</span></div>
     </div>
   </div>

   <div class="amount-words"><b>Amount in Words:</b> ${amountWords(total)}</div>

   <div class="bottom-grid">
     <div class="bottom-box">
       <h4>Payment & Delivery</h4>
       <p>Payment Mode: <b>${esc(payment)}</b><br>Order Status: <b>${esc(status)}</b><br>${o.delivery_speed?('Delivery Type: '+esc(o.delivery_speed)):''}</p>
     </div>
     <div class="bottom-box">
       <h4>Terms & Support</h4>
       <p>This is a computer generated invoice. For order support, please contact MediFinder India through the support section of the website/app.</p>
     </div>
     <div class="bottom-box">
       <h4>Authorised Signatory</h4>
       <div class="sign">For MediFinder India / Partner Store</div>
     </div>
   </div>

   <div class="footer">Thank you for choosing <b>MediFinder India</b> · Your Health, Our Priority</div>
 </div>
 </div>`;
}

function amountWords(n){
 const num=Math.round(Number(n||0));
 if(num===0)return'Zero only';
 const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 function two(x){return x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'')}
 function three(x){return x<100?two(x):ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):'')}
 let x=num,s='';
 if(x>=10000000){s+=three(Math.floor(x/10000000))+' Crore ';x%=10000000}
 if(x>=100000){s+=three(Math.floor(x/100000))+' Lakh ';x%=100000}
 if(x>=1000){s+=three(Math.floor(x/1000))+' Thousand ';x%=1000}
 if(x)s+=three(x);
 return ('Rupees '+s.trim()+' only').replace(/\s+/g,' ');
}
load();
</script>
</body>
</html>
