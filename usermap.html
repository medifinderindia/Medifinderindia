<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#e02020">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediFinder - Nearby Pharmacy Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
      <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="usermap.css?v=13">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="supabase-constants.js"></script>
</head>
<body>

    <header>
        <div class="logo">
            <img src="1779304435608.png" alt="MediFinder Logo">
            <h1>MEDI <span>FINDER</span></h1>
        </div>
        <div class="user-location">
            <i class="fa-solid fa-location-dot"></i> <span id="current-city">Detecting your location...</span>
        </div>
    </header>

    <main class="map-container-section">
        
        <div class="search-bar-container">
            <div class="search-bar" style="position: relative;">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="medicine-search" placeholder="Search paracetamol, vitamin c...">
                <button id="map-search-btn"><i class="fa-solid fa-arrow-right"></i></button>
                <!-- Search suggestions box auto-injected by userscript.js will appear here -->
            </div>
        </div>

        <div class="map-wrapper-premium">
            <div id="map"></div>
            <button class="locate-btn" id="live-location-btn">
                <i class="fa-solid fa-crosshairs"></i> Live Location
            </button>
        </div>

        <div class="results-container">
            <div class="results-header">
                <h3><i class="fa-solid fa-store"></i> Nearby Registered Pharmacies</h3>
                <span class="count-badge" id="pharmacy-count">0 Found</span>
            </div>
            
            <div id="search-results" class="pharmacy-grid-layout">
                <div style="text-align:center;padding:20px;color:#747d8c;"><i class="fa-solid fa-spinner fa-spin" style="font-size:1.5rem;color:#e02020;margin-bottom:8px;display:block;"></i><p style="font-size:0.82rem;">Loading nearby pharmacies...</p></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
        <div class="nav-item" onclick="window.location.href='userhome.html'">
            <i class="fas fa-home"></i>
            <span>HOME</span>
        </div>
        <div class="nav-item active" onclick="window.location.href='usermap.html'">
            <i class="fas fa-map-marked-alt"></i>
            <span>MAP</span>
        </div>
        <div class="hamburger-nav-item" id="hamburger-btn">
            <div class="hamburger-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="nav-item" onclick="window.location.href='userorder.html'">
            <i class="fas fa-clipboard-list"></i>
            <span>ORDER</span>
        </div>
        <div class="nav-item" onclick="window.location.href='usercart.html'">
            <i class="fas fa-shopping-cart"></i>
            <span>CART</span>
        </div>
    </nav>

    <div class="hamburger-overlay" id="hamburger-overlay">
        <div class="hamburger-menu-panel">
            <div class="hamburger-header">
                <div class="hamburger-profile">
                    <div class="hamburger-profile-pic"><img src="1779304435608.png" alt="Profile"></div>
                    <div class="hamburger-profile-info">
                        <h3 id="hamburger-user-name">Guest User</h3>
                        <p><i class="fa-solid fa-id-badge"></i> <span id="hamburger-user-id">MF000000</span></p>
                    </div>
                </div>
                <button class="hamburger-close-btn" id="hamburger-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="hamburger-menu-list">
                <div class="hamburger-menu-item" onclick="window.location.href='userprofile.html'"><i class="fa-solid fa-user-circle"></i><span>My Profile</span></div>
                <div class="hamburger-menu-item" onclick="window.location.href='usercart.html'"><i class="fa-solid fa-shopping-cart"></i><span>My Cart</span></div>
                <div class="hamburger-menu-item" onclick="window.location.href='userorder.html'"><i class="fa-solid fa-clipboard-list"></i><span>My Orders</span></div>
                <div class="hamburger-menu-item" onclick="window.location.href='usermap.html'"><i class="fa-solid fa-map-location-dot"></i><span>Track on Map</span></div>
                <div class="hamburger-menu-item" onclick="window.location.href='userprofile.html#my-box-btn'"><i class="fa-solid fa-file-prescription"></i><span>My Prescriptions</span></div>
                <div class="hamburger-menu-item" onclick="window.location.href='userprofile.html#refer-earn-btn'"><i class="fa-solid fa-tag"></i><span>Offers & Coupons</span></div>
                <div class="hamburger-menu-item" onclick="window.location.href='userprofile.html#help-desk-trigger'"><i class="fa-solid fa-headset"></i><span>Customer Support</span></div>
                <div class="hamburger-menu-divider"></div>
                <div class="hamburger-menu-item logout-item" onclick="showConfirmationModal('Logout from MediFinder?', () => { localStorage.clear(); window.location.href='index.html'; })"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="prod-utils.js?v=13"></script>
    <script src="userscript.js?v=13"></script>
</body>
</html>
